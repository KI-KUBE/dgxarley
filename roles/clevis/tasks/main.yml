---
# file: roles/clevis/tasks/main.yml

- name: configure clevis/tang NBDE for automatic LUKS decryption
  import_tasks: config_clevis.yml
  # the play also runs for keyfile-only hosts (no tang): never configure tang there
  when:
    - wantsclevis | default(false) | bool
    - clevis_tang_servers | length > 0
  tags:
    - clevis

- name: report a clevis host without any reachable tang server
  debug:
    msg: >-
      {{ inventory_hostname }}: wantsclevis but no other host provides tang; binding skipped,
      boot relies on the keyfile fallback / passphrase.
  when:
    - wantsclevis | default(false) | bool
    - clevis_tang_servers | length == 0
  tags:
    - clevis

# a stale setup_clevis_tang.sh would re-bind to the old tang list; config_clevis.yml redeploys both
- name: remove the tang helper scripts from a host without tang servers
  file:
    path: "/root/{{ item }}"
    state: absent
  loop:
    - setup_clevis_tang.sh
    - tang_check_connection.sh
  when:
    - wantsclevis | default(false) | bool
    - clevis_tang_servers | length == 0
  tags:
    - clevis

- name: optional LUKS keyfile fallback (USB stick / key file on /boot)
  import_tasks: keyfile_fallback.yml
  tags:
    - clevis
    - clevis_keyfile

# after the keyfile fallback, so the host keeps an automatic unlock path when tang goes
- name: opt-in removal of the clevis/tang binding
  import_tasks: tang_teardown.yml
  when: clevis_tang_teardown | default(false) | bool
  tags:
    - clevis
