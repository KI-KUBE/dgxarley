---
# keyfile_fallback.yml
# Optional LUKS keyfile fallback next to clevis/tang: an extra LUKS keyslot whose
# key is offered in the initramfs from a labelled USB stick and/or a plain file on
# the unencrypted /boot partition. The key itself is never put into the initrd.
#
# Two initramfs generators are supported (fact clevis_initramfs_generator), both with the same
# race model: ALL enabled key sources are offered at boot in parallel to the console passphrase
# prompt, the first valid answer wins, crypttab is never modified.
#   initramfs-tools: hook + local-top/local-bottom scripts feed the key into
#     cryptroot's askpass (passfifo); tang (clevis-initramfs), keyfile and typed passphrase race.
#   dracut (systemd-cryptsetup, e.g. Ubuntu 26.04 without initramfs-tools): the dracut module
#     clevis-keyfile ships a systemd password agent that answers systemd-cryptsetup's
#     ask-password requests with the /boot / USB key, next to the console prompt.
#     tang there is clevis-dracut's job (config_clevis.yml, same ask-password mechanism): the
#     clevis-luks-askpass agent, this keyfile agent and the typed passphrase answer the same ask
#     files, the first valid answer wins.
#
# Independent of the tang servers, so it can run before they exist:
#   ansible-playbook common.yml --tags clevis_keyfile -e clevis_keyfile_enabled=true
#
# Key sources (optional, combinable): USB stick by label and
# a plain key file on an unencrypted local partition (clevis_keyfile_boot_*, default /boot,
# referenced as UUID=<uuid> derived from `findmnt` at run time). All enabled sources are tried.
#
# Adding the keyslot needs an existing key: clevis_keyfile_auth_keyfile if valid,
# else clevis_luks_passphrase if valid, else the key recovered from an existing
# clevis binding (`clevis luks pass`).
#
# Teardown (removes the keyslot, the initramfs scripts / dracut module and shreds the key):
#   ansible-playbook common.yml --tags clevis_keyfile -e clevis_keyfile_teardown=true

- name: detect initramfs generator (keyfile fallback)
  import_tasks: detect_generator.yml
  when: >-
    (clevis_keyfile_enabled | default(false) | bool) or
    (clevis_keyfile_teardown | default(false) | bool)

- name: detect LUKS device (keyfile fallback)
  import_tasks: detect_luks.yml
  when: >-
    (clevis_keyfile_enabled | default(false) | bool) or
    (clevis_keyfile_teardown | default(false) | bool)

- name: "keyfile fallback (dracut): refuse a crypttab left over from the old keyfile:device variant"
  when:
    - clevis_keyfile_enabled | default(false) or clevis_keyfile_teardown | default(false)
    - clevis_has_luks | bool
    - clevis_initramfs_generator == 'dracut'
  block:
    - name: look for managed keyfile / keyfile-timeout entries in the crypttab line of the mapper
      shell: |
        set -euo pipefail
        awk -v m="$MAPPER" -v kp="$KEYDIR" -v ul="$USB_LABEL" -v bf="/$BOOT_FILE:UUID=" '
          $1 == m {
            f3 = $3; f4 = $4
            if (f4 ~ /keyfile-timeout=/ || index(f3, kp) == 1 || index(f3, bf) == 1 || f3 ~ (":LABEL=" ul "$")) { print "LEGACY"; exit }
          }' /etc/crypttab
      args:
        executable: /bin/bash
      environment:
        MAPPER: "{{ clevis_luks_mapper | default('') }}"
        KEYDIR: "{{ clevis_keyfile_path | dirname }}/"
        USB_LABEL: "{{ clevis_keyfile_usb_label }}"
        BOOT_FILE: "{{ clevis_keyfile_boot_file | regex_replace('^/+', '') }}"
      register: clevis_crypttab_legacy
      changed_when: false
      check_mode: false

    - name: fail on a legacy crypttab edit (never edited silently)
      fail:
        msg: >-
          /etc/crypttab line of '{{ clevis_luks_mapper }}' still carries the old keyfile variant
          (keyfile-timeout= or a key path / ':LABEL=' / ':UUID=' in field 3). This role never touches
          crypttab any more: restore field 3 to 'none' and drop keyfile-timeout= from field 4
          (backup of the original: /etc/crypttab.clevis-keyfile.bak), then run again.
      when: "'LEGACY' in clevis_crypttab_legacy.stdout"

- name: refuse the removed initrd-embedding option
  fail:
    msg: >-
      clevis_keyfile_embed_initramfs was removed (the key is never put into the initrd any more).
      Drop the variable and use clevis_keyfile_boot_enabled (key file on /boot) instead; the next
      run rebuilds the initrd without the key.
  when: clevis_keyfile_embed_initramfs | default(false) | bool

- name: "LUKS keyfile fallback: install"
  when:
    - clevis_keyfile_enabled | default(false) | bool
    - not (clevis_keyfile_teardown | default(false) | bool)
    - clevis_has_luks | bool
  block:
    - name: resolve the unencrypted partition holding the boot key file
      when: clevis_keyfile_boot_enabled | bool
      block:
        - name: query the mount of the boot key partition
          command: findmnt -nP -o UUID,SOURCE,FSTYPE {{ clevis_keyfile_boot_mount | quote }}
          register: clevis_boot_findmnt
          changed_when: false
          failed_when: false
          check_mode: false

        - name: set boot key partition facts
          set_fact:
            clevis_boot_uuid: "{{ (clevis_boot_findmnt.stdout | regex_search('UUID=\"([^\"]*)\"', '\\1') | default([''], true)) | first }}"
            clevis_boot_source: "{{ (clevis_boot_findmnt.stdout | regex_search('SOURCE=\"([^\"]*)\"', '\\1') | default([''], true)) | first }}"
            clevis_boot_fstype: "{{ (clevis_boot_findmnt.stdout | regex_search('FSTYPE=\"([^\"]*)\"', '\\1') | default([''], true)) | first }}"

        - name: require a local block filesystem with a UUID
          assert:
            that:
              - clevis_boot_findmnt.rc == 0
              - clevis_boot_uuid | length > 0
              - clevis_boot_source.startswith('/dev/')
            fail_msg: >-
              clevis_keyfile_boot_mount={{ clevis_keyfile_boot_mount }} must be a mounted local block filesystem
              with a UUID (findmnt rc={{ clevis_boot_findmnt.rc }}: '{{ clevis_boot_findmnt.stdout }}').
            quiet: true

        - name: warn about missing POSIX permissions on vfat
          debug:
            msg: "WARNING: {{ clevis_keyfile_boot_mount }} is vfat: the key file cannot be protected with 0600 there (ext4 /boot recommended)."
          when: clevis_boot_fstype == 'vfat'

    - name: create keyfile directory
      file:
        path: /etc/clevis-keyfile
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: generate fallback keyfile (ASCII, no trailing newline; must survive askpass' passfifo)
      shell: |
        set -euo pipefail
        umask 077
        head -c 48 /dev/urandom | base64 -w0 > {{ clevis_keyfile_path | quote }}
      args:
        executable: /bin/bash
        creates: "{{ clevis_keyfile_path }}"
      register: clevis_keyfile_generated

    - name: check whether the fallback key already unlocks the LUKS device
      command: cryptsetup open --test-passphrase --key-file {{ clevis_keyfile_path | quote }} {{ clevis_luks_device | quote }}
      register: clevis_keyfile_enrolled
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode or not (clevis_keyfile_generated is changed)

    - name: add the fallback key as an extra LUKS keyslot
      when:
        - not ansible_check_mode
        - clevis_keyfile_enrolled.rc | default(1) != 0
      block:
        - name: write LUKS passphrase to temporary auth file
          copy:
            content: "{{ clevis_luks_passphrase }}"
            dest: /run/.clevis_keyfile_auth
            mode: '0600'
          no_log: true
          when: clevis_luks_passphrase is defined

        - name: add LUKS keyslot (auth via key file, else passphrase, else existing clevis binding)
          shell: |
            set -uo pipefail
            DEV={{ clevis_luks_device | quote }}
            NEW={{ clevis_keyfile_path | quote }}
            PRE={{ clevis_keyfile_auth_keyfile | quote }}
            AUTH=/run/.clevis_keyfile_auth
            umask 077
            if [ -n "$PRE" ] && [ -s "$PRE" ] && cryptsetup open --test-passphrase --key-file "$PRE" "$DEV" 2>/dev/null; then
              KEY="$PRE"
            elif [ -s "$AUTH" ] && cryptsetup open --test-passphrase --key-file "$AUTH" "$DEV" 2>/dev/null; then
              KEY="$AUTH"
            else
              ok=0
              for slot in $(clevis luks list -d "$DEV" 2>/dev/null | awk -F: '{print $1}'); do
                if clevis luks pass -d "$DEV" -s "$slot" > "$AUTH" 2>/dev/null \
                   && cryptsetup open --test-passphrase --key-file "$AUTH" "$DEV" 2>/dev/null; then
                  ok=1
                  break
                fi
              done
              if [ "$ok" != 1 ]; then
                echo "No valid existing key: clevis_keyfile_auth_keyfile / clevis_luks_passphrase are wrong/unset and no clevis binding could be unlocked." >&2
                exit 2
              fi
              KEY="$AUTH"
            fi
            cryptsetup luksAddKey --key-file "$KEY" "$DEV" "$NEW"
          args:
            executable: /bin/bash
          register: clevis_keyfile_added

      always:
        - name: remove temporary auth file
          file:
            path: /run/.clevis_keyfile_auth
            state: absent

    - name: "boot key file: directory and copy on {{ clevis_keyfile_boot_mount }}"
      when: clevis_keyfile_boot_enabled | bool
      block:
        - name: create the directory of the boot key file
          file:
            path: "{{ clevis_keyfile_boot_mount }}/{{ clevis_keyfile_boot_file | dirname }}"
            state: directory
            owner: "{{ omit if clevis_boot_fstype == 'vfat' else 'root' }}"
            group: "{{ omit if clevis_boot_fstype == 'vfat' else 'root' }}"
            mode: "{{ omit if clevis_boot_fstype == 'vfat' else '0700' }}"
          when: (clevis_keyfile_boot_file | dirname) | length > 0

        - name: copy the key to the boot partition
          copy:
            src: "{{ clevis_keyfile_path }}"
            remote_src: true
            dest: "{{ clevis_keyfile_boot_mount }}/{{ clevis_keyfile_boot_file }}"
            owner: "{{ omit if clevis_boot_fstype == 'vfat' else 'root' }}"
            group: "{{ omit if clevis_boot_fstype == 'vfat' else 'root' }}"
            mode: "{{ omit if clevis_boot_fstype == 'vfat' else '0600' }}"
          register: clevis_keyfile_bootfile_changed

    - name: "boot key file disabled: remove a copy left on {{ clevis_keyfile_boot_mount }}"
      import_tasks: remove_boot_keyfile.yml
      when: not (clevis_keyfile_boot_enabled | bool)

    - name: deploy keyfile fallback config
      template:
        src: etc_clevis-keyfile_keyfile.conf.j2
        dest: /etc/clevis-keyfile/keyfile.conf
        owner: root
        group: root
        mode: '0600'
      register: clevis_keyfile_conf_changed

    - name: deploy clevis_keyfile_write_usb.sh
      template:
        src: clevis_keyfile_write_usb.sh.j2
        dest: /root/clevis_keyfile_write_usb.sh
        owner: root
        group: root
        mode: '0755'

    - name: "keyfile fallback (initramfs-tools): hooks, scripts, rebuild"
      when: clevis_initramfs_generator == 'initramfs-tools'
      block:
      - name: deploy clevis-keyfile initramfs hook
        copy:
          src: initramfs_hooks_clevis-keyfile
          dest: /etc/initramfs-tools/hooks/clevis-keyfile
          owner: root
          group: root
          mode: '0755'
        register: clevis_keyfile_hook_changed

      - name: deploy clevis-keyfile initramfs local-top script
        copy:
          src: initramfs_local-top_clevis-keyfile
          dest: /etc/initramfs-tools/scripts/local-top/clevis-keyfile
          owner: root
          group: root
          mode: '0755'
        register: clevis_keyfile_localtop_changed

      - name: deploy clevis-keyfile initramfs local-bottom script
        copy:
          src: initramfs_local-bottom_clevis-keyfile
          dest: /etc/initramfs-tools/scripts/local-bottom/clevis-keyfile
          owner: root
          group: root
          mode: '0755'
        register: clevis_keyfile_localbottom_changed

      # left over from the removed initrd-embedding option
      - name: drop the initramfs umask override
        file:
          path: /etc/initramfs-tools/conf.d/clevis-keyfile-umask
          state: absent
        register: clevis_keyfile_umask_removed

      - name: rebuild initramfs for all kernels (keyfile fallback)
        command: update-initramfs -u -k all
        when: >-
          (clevis_keyfile_conf_changed is changed) or
          (clevis_keyfile_hook_changed is changed) or
          (clevis_keyfile_localtop_changed is changed) or
          (clevis_keyfile_localbottom_changed is changed) or
          (clevis_keyfile_umask_removed is changed)

      - name: verify keyfile fallback in initramfs
        shell: lsinitramfs /boot/initrd.img-$(uname -r) 2>/dev/null | grep -E 'clevis-keyfile' || true
        register: clevis_keyfile_initramfs_check
        changed_when: false
        check_mode: false

      - name: look for a LUKS key left in any initrd (removed embedding option)
        shell: |
          for f in /boot/initrd.img-*; do
            [ -e "$f" ] || continue
            lsinitramfs "$f" 2>/dev/null | grep -qE '(^|/)etc/clevis-keyfile/fallback\.key$' && echo "$f"
          done
          exit 0
        register: clevis_keyfile_initrd_leak
        changed_when: false
        check_mode: false

      - name: fail if an initrd still carries the key
        fail:
          msg: "The LUKS fallback key is still inside: {{ clevis_keyfile_initrd_leak.stdout_lines | join(', ') }} -- rebuild those initrds (update-initramfs -u -k all) or remove them."
        when:
          - not ansible_check_mode
          - clevis_keyfile_initrd_leak.stdout | trim | length > 0

    - name: "keyfile fallback (dracut / systemd-cryptsetup): password agent module, rebuild"
      when: clevis_initramfs_generator == 'dracut'
      block:
        - name: create the dracut module directory
          file:
            path: /usr/lib/dracut/modules.d/90clevis-keyfile
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: deploy the clevis-keyfile dracut module
          copy:
            src: "dracut/90clevis-keyfile/{{ item.name }}"
            dest: "/usr/lib/dracut/modules.d/90clevis-keyfile/{{ item.name }}"
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - {name: module-setup.sh, mode: '0755'}
            - {name: clevis-keyfile-agent.sh, mode: '0755'}
            - {name: clevis-keyfile-agent.service, mode: '0644'}
          register: clevis_dracut_module_deployed

        - name: deploy dracut config (add the module)
          copy:
            src: dracut/90-clevis-keyfile.conf
            dest: /etc/dracut.conf.d/90-clevis-keyfile.conf
            owner: root
            group: root
            mode: '0644'
          register: clevis_dracut_conf_deployed

        - name: rebuild initramfs for all kernels (dracut, keyfile fallback)
          import_tasks: dracut_rebuild.yml
          when: >-
            (clevis_keyfile_conf_changed is changed) or
            (clevis_dracut_module_deployed is changed) or
            (clevis_dracut_conf_deployed is changed)

        - name: verify keyfile fallback in the dracut initramfs
          shell: |
            set -uo pipefail
            INITRD=$(ls /boot/initrd.img-"$(uname -r)" /boot/initramfs-"$(uname -r)".img 2>/dev/null | head -1 || true)
            if [ -z "$INITRD" ]; then echo "ERROR: no initrd found for $(uname -r)"; exit 1; fi
            echo "initrd: $INITRD"
            LIST=$(lsinitrd "$INITRD" 2>/dev/null)
            for f in usr/libexec/clevis-keyfile-agent clevis-keyfile-agent.service etc/clevis-keyfile/keyfile.conf; do
              grep -qE "(^|[[:space:]])[^[:space:]]*$f(\$|[[:space:]])" <<< "$LIST" \
                || { echo "ERROR: $f not in $INITRD"; exit 1; }
              echo "present: $f"
            done
            if [ "$USB" = 1 ] || [ "$BOOT" = 1 ]; then
              for m in "usb[-_]storage" vfat ext4; do
                if grep -qE "/$m\.ko" <<< "$LIST"; then echo "module $m: present"
                else echo "WARN: module $m not in $INITRD (fine only if built into the kernel)"; fi
              done
            fi
            # left over from the removed initrd-embedding option
            leak=0
            for f in /boot/initrd.img-* /boot/initramfs-*.img; do
              [ -e "$f" ] || continue
              if lsinitrd "$f" 2>/dev/null | grep -qE '(^|[[:space:]])etc/clevis-keyfile/fallback\.key$'; then
                echo "ERROR: $f still carries the LUKS key, rebuild it"
                leak=1
              fi
            done
            exit "$leak"
          args:
            executable: /bin/bash
          environment:
            USB: "{{ 1 if (clevis_keyfile_usb_enabled | bool) else 0 }}"
            BOOT: "{{ 1 if (clevis_keyfile_boot_enabled | bool) else 0 }}"
          register: clevis_dracut_check
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: display dracut initramfs verification
          debug:
            msg: "{{ clevis_dracut_check.stdout_lines }}"
          when: not ansible_check_mode

    - name: display keyfile fallback status
      debug:
        msg:
          - "initramfs generator: {{ clevis_initramfs_generator }}"
          - "USB stick: {{ ('label ' + clevis_keyfile_usb_label + ', file ' + (('/' + clevis_keyfile_usb_dir + '/' + inventory_hostname + '.key') if clevis_keyfile_usb_dir | default('') else ('/' + clevis_keyfile_usb_file)) + ' -- write it with: /root/clevis_keyfile_write_usb.sh /dev/sdX1') if (clevis_keyfile_usb_enabled | bool) else 'disabled' }}"
          - "{{ ('boot key file: ' + clevis_keyfile_boot_mount + '/' + clevis_keyfile_boot_file + ' (UUID=' + clevis_boot_uuid + ', ' + clevis_boot_fstype + ')') if (clevis_keyfile_boot_enabled | bool) else 'boot key file: disabled' }}"

- name: "LUKS keyfile fallback: teardown"
  when:
    - clevis_keyfile_teardown | default(false) | bool
    - clevis_has_luks | bool
  block:
    - name: stat fallback keyfile
      stat:
        path: "{{ clevis_keyfile_path }}"
      register: clevis_keyfile_stat

    # dracut: drop the module first, so a later failure cannot leave an initrd whose agent
    # offers a key that no longer unlocks (harmless, but noisy).
    - name: "keyfile fallback teardown (dracut): module, dracut conf, rebuild"
      when: clevis_initramfs_generator == 'dracut'
      block:
        - name: remove the clevis-keyfile dracut module and config
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /usr/lib/dracut/modules.d/90clevis-keyfile
            - /etc/dracut.conf.d/90-clevis-keyfile.conf
          register: clevis_dracut_removed

        - name: rebuild initramfs for all kernels (dracut, keyfile fallback removed)
          import_tasks: dracut_rebuild.yml
          when: clevis_dracut_removed is changed

    - name: check whether the fallback key still unlocks the LUKS device
      command: cryptsetup open --test-passphrase --key-file {{ clevis_keyfile_path | quote }} {{ clevis_luks_device | quote }}
      register: clevis_keyfile_still_enrolled
      changed_when: false
      failed_when: false
      check_mode: false
      when: clevis_keyfile_stat.stat.exists

    - name: count active LUKS keyslots
      shell: cryptsetup luksDump {{ clevis_luks_device | quote }} | grep -cE '^[[:space:]]+[0-9]+:[[:space:]]+luks2$|^Key Slot [0-9]+:[[:space:]]+ENABLED$'
      register: clevis_keyfile_slot_count
      changed_when: false
      failed_when: false
      check_mode: false

    - name: refuse to remove the last LUKS keyslot
      fail:
        msg: "The fallback key holds the only remaining LUKS keyslot -- removing it would make the disk unrecoverable."
      when:
        - clevis_keyfile_still_enrolled.rc | default(1) == 0
        - clevis_keyfile_slot_count.stdout | default('0') | int <= 1

    - name: remove the fallback LUKS keyslot
      command: cryptsetup luksRemoveKey {{ clevis_luks_device | quote }} {{ clevis_keyfile_path | quote }}
      when: clevis_keyfile_still_enrolled.rc | default(1) == 0

    - name: warn if the keyfile is gone but a keyslot may remain
      debug:
        msg: >-
          WARNING: {{ clevis_keyfile_path }} does not exist, so the fallback keyslot cannot be identified.
          Check `cryptsetup luksDump {{ clevis_luks_device }}` and remove a leftover slot by hand
          (cryptsetup luksKillSlot) if you still have the key, e.g. on the USB stick.
      when: not clevis_keyfile_stat.stat.exists

    - name: remove the boot key file
      import_tasks: remove_boot_keyfile.yml

    - name: remove keyfile fallback config and helper
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/clevis-keyfile/keyfile.conf
        - /root/clevis_keyfile_write_usb.sh
      register: clevis_keyfile_files_removed

    - name: remove keyfile fallback initramfs-tools files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/initramfs-tools/hooks/clevis-keyfile
        - /etc/initramfs-tools/scripts/local-top/clevis-keyfile
        - /etc/initramfs-tools/scripts/local-bottom/clevis-keyfile
        - /etc/initramfs-tools/conf.d/clevis-keyfile-umask
      register: clevis_keyfile_tools_files_removed
      when: clevis_initramfs_generator == 'initramfs-tools'

    - name: rebuild initramfs for all kernels (keyfile fallback removed)
      command: update-initramfs -u -k all
      when:
        - clevis_initramfs_generator == 'initramfs-tools'
        - (clevis_keyfile_files_removed is changed) or (clevis_keyfile_tools_files_removed is changed)

    - name: shred fallback keyfile
      command: shred -u {{ clevis_keyfile_path | quote }}
      when:
        - clevis_keyfile_stat.stat.exists
        - not ansible_check_mode

    - name: remove keyfile directory
      file:
        path: /etc/clevis-keyfile
        state: absent

    - name: display teardown reminder
      debug:
        msg: "Keyfile fallback removed. Wipe the key from any USB stick ({{ ('/' ~ clevis_keyfile_usb_dir ~ '/' ~ inventory_hostname ~ '.key and /') if clevis_keyfile_usb_dir | default('') else '/' }}{{ clevis_keyfile_usb_file }}); with the keyslot gone, old copies no longer unlock the disk."
