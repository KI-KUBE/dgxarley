---
# config_clevis.yml
# Configure automatic LUKS decryption via clevis/tang (NBDE)
#
# Requires:
#   - wantsclevis: true on the host
#   - hw_iface: <network-interface> on the host
#   - clevis_luks_passphrase provided for initial bind (e.g., -e 'clevis_luks_passphrase=...')
#
# The LUKS partition is auto-detected from /etc/crypttab.
# After initial bind, subsequent runs are idempotent without passphrase.
#
# Usage:
#
#   # Initial run (passphrase required for clevis luks bind):
#   ansible-playbook common.yml  --tags clevis \
#     -e 'clevis_luks_passphrase=DEIN_LUKS_PASSWORT'
#
#   # Subsequent runs (idempotent, no passphrase needed):
#   ansible-playbook common.yml  --tags clevis
#
#   # Dry run:
#   ansible-playbook common.yml  --tags clevis --check --diff
#
# What this does:
#   1. Installs clevis packages (clevis, clevis-luks, clevis-systemd + clevis-initramfs on
#      initramfs-tools hosts or clevis-dracut on dracut hosts)
#   2. Auto-detects the LUKS partition from /etc/crypttab
#   3. Checks for existing clevis bindings (skips bind if one matches clevis_tang_servers + threshold)
#   4. Fetches tang advertisements and creates clevis/tang SSS binding (threshold clevis_sss_threshold);
#      on drift, test-unlocks via the new slot and then unbinds the stale tang slots
#   5. Configures initrd networking, depending on the generator (fact clevis_initramfs_generator,
#      detect_generator.yml):
#        initramfs-tools: interface driver, DEVICE=, IP=:::::<device>:dhcp, netplan cleanup,
#          dhcp-release; rebuild with update-initramfs
#        dracut (systemd-cryptsetup, e.g. Ubuntu 26.04): /etc/dracut.conf.d/90-clevis.conf (modules
#          clevis + network, kernel_cmdline rd.neednet=1 ip=<iface>:dhcp, NIC driver); rebuild with
#          dracut_rebuild.yml. clevis-luks-askpass answers systemd-cryptsetup's ask-password
#          requests, racing with the console prompt and the keyfile agent.
#   6. Rebuilds the initrd (only when changes occurred)
#   7. Deploys setup_clevis_tang.sh and tang_check_connection.sh to /root/
#   8. Verifies clevis hooks and network driver in the initrd (lsinitramfs / lsinitrd)
#
# Defaults (roles/clevis/defaults/main.yml):
#   clevis_tang_servers: (derived from providestang hosts in group_vars/all/main/common.yml)
#   clevis_sss_threshold: 1
#
# wantsclevis_initramfs: false skips every initrd step on both generators (binding only).
#
# The existing LUKS passphrase remains valid as fallback.
# If tang servers are unreachable at boot, the normal password prompt appears.

# --- Initramfs generator (dracut | initramfs-tools) ---

- name: detect initramfs generator
  import_tasks: detect_generator.yml

# --- Install clevis packages ---

- name: install clevis packages for NBDE
  apt:
    pkg:
      - clevis
      - clevis-luks
      - clevis-systemd
    state: present
    update_cache: true

- name: install clevis-initramfs package
  apt:
    pkg:
      - clevis-initramfs
    state: present
  when:
    - wantsclevis_initramfs | default(true)
    - clevis_initramfs_generator == 'initramfs-tools'

# clevis-dracut ships only the dracut modules (60clevis, 60clevis-pin-{null,sss,tang,tpm2});
# the askpass agent (clevis-luks-askpass) comes from clevis-systemd, installed above.
# It depends on dracut-network, which provides the network modules.
- name: install clevis-dracut package
  apt:
    pkg:
      - clevis-dracut
    state: present
  when:
    - wantsclevis_initramfs | default(true)
    - clevis_initramfs_generator == 'dracut'

# --- Detect LUKS device from crypttab ---

- name: detect LUKS device
  import_tasks: detect_luks.yml

# --- Check existing clevis bindings ---

- name: check existing clevis bindings
  command: clevis luks list -d {{ clevis_luks_device }}
  register: clevis_existing_bindings
  changed_when: false
  failed_when: false
  check_mode: false
  when: clevis_has_luks | bool

- name: classify existing clevis bindings
  import_tasks: parse_bindings.yml
  vars:
    _clevis_list_lines: "{{ clevis_existing_bindings.stdout_lines | default([]) }}"
  when: clevis_has_luks | bool

# A drifted tang set (other servers / threshold) binds a new slot; the stale one goes after the unlock test below.
- name: set bind-needed flag
  set_fact:
    clevis_needs_bind: "{{ _clevis_match_slots | length == 0 }}"
  when: clevis_has_luks | bool

- name: display binding status
  debug:
    msg: >-
      {{ 'No clevis bindings found - bind needed'
         if (clevis_needs_bind | bool)
         else 'Existing bindings: ' + clevis_existing_bindings.stdout }}
  when: clevis_has_luks | bool

# --- Fail early if passphrase missing for bind ---

- name: verify clevis_luks_passphrase is defined for binding
  fail:
    msg: >-
      clevis_luks_passphrase must be provided for initial clevis bind
      (e.g., -e 'clevis_luks_passphrase=YOUR_PASSPHRASE').
  when:
    - clevis_has_luks | bool
    - clevis_needs_bind | bool
    - clevis_luks_passphrase is not defined
    # - not ansible_check_mode

# --- Verify tang server connectivity ---

- name: verify tang server connectivity
  uri:
    url: "{{ item }}/adv"
    return_content: false
    timeout: 5
  loop: "{{ clevis_tang_servers }}"
  loop_control:
    label: "{{ item }}"
  when: clevis_has_luks | bool

# --- Bind clevis/tang (SSS) to LUKS device ---

- name: bind clevis/tang (SSS) to LUKS device
  block:
    - name: write LUKS passphrase to temporary keyfile
      copy:
        content: "{{ clevis_luks_passphrase }}"
        dest: /tmp/.clevis_luks_key
        mode: '0600'
      no_log: true

    - name: fetch tang advertisements and create clevis binding
      shell: |
        set -euo pipefail

        # Build tang pin array with pre-fetched advertisements
        TANG_PINS="["
        FIRST=true
        {% for server in clevis_tang_servers %}
        ADV=$(curl -sfS "{{ server }}/adv")
        if [ "$FIRST" = true ]; then FIRST=false; else TANG_PINS+=","; fi
        TANG_PINS+=$(jq -n --argjson adv "$ADV" --arg url "{{ server }}" \
          '{"url": $url, "adv": $adv}')
        {% endfor %}
        TANG_PINS+="]"

        CONFIG=$(jq -n \
          --argjson pins "$TANG_PINS" \
          --argjson t {{ clevis_sss_threshold }} \
          '{"t": $t, "pins": {"tang": $pins}}')

        clevis luks bind -k /tmp/.clevis_luks_key -d {{ clevis_luks_device }} sss "$CONFIG"
      args:
        executable: /bin/bash
      register: clevis_bind_result

  always:
    - name: remove temporary keyfile
      file:
        path: /tmp/.clevis_luks_key
        state: absent
  when:
    - clevis_has_luks | bool
    - clevis_needs_bind | bool
    - not ansible_check_mode

# --- Verify binding ---

- name: verify clevis binding
  command: clevis luks list -d {{ clevis_luks_device }}
  register: clevis_verify_binding
  changed_when: false
  when: clevis_has_luks | bool

- name: display current bindings
  debug:
    msg: "Current clevis bindings: {{ clevis_verify_binding.stdout }}"
  when: clevis_has_luks | bool

# --- Retire stale tang bindings (only after the desired binding provably unlocks) ---

- name: retire stale clevis/tang bindings
  when:
    - clevis_has_luks | bool
    - not ansible_check_mode
  block:
    - name: re-classify clevis bindings after bind
      import_tasks: parse_bindings.yml
      vars:
        _clevis_list_lines: "{{ clevis_verify_binding.stdout_lines | default([]) }}"

    - name: assert exactly the desired binding exists
      assert:
        that:
          - _clevis_match_slots | length >= 1
        fail_msg: "No clevis slot matches {{ clevis_tang_servers }} (t={{ clevis_sss_threshold }}): {{ clevis_verify_binding.stdout }}"

    - name: test-unlock the LUKS device through the desired binding
      shell: |
        set -euo pipefail
        clevis luks pass -d {{ clevis_luks_device | quote }} -s {{ _clevis_match_slots[0] }} \
          | cryptsetup open --test-passphrase --key-file - {{ clevis_luks_device | quote }}
      args:
        executable: /bin/bash
      changed_when: false
      when: _clevis_stale_slots | length > 0

    - name: unbind stale clevis/tang slots
      command: clevis luks unbind -f -d {{ clevis_luks_device | quote }} -s {{ item }}
      loop: "{{ _clevis_stale_slots }}"

# --- Network interface and driver for the initrd (both generators) ---

- name: set initrd network interface fact
  set_fact:
    clevis_net_iface: "{{ hw_iface | default(ansible_default_ipv4.interface) }}"
  when: clevis_has_luks | bool

- name: detect network interface driver
  shell: basename $(readlink /sys/class/net/{{ clevis_net_iface }}/device/driver) 2>/dev/null || echo ""
  register: clevis_net_driver
  changed_when: false
  check_mode: false
  when:
    - clevis_has_luks | bool
    - wantsclevis_initramfs | default(true)

# --- initramfs-tools path (hosts without dracut) ---

- name: tang on initramfs-tools (clevis-initramfs, initramfs.conf IP=, update-initramfs)
  when: clevis_initramfs_generator == 'initramfs-tools'
  block:
    - name: ensure network driver in initramfs modules
      lineinfile:
        path: /etc/initramfs-tools/modules
        line: "{{ clevis_net_driver.stdout }}"
        state: present
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - clevis_net_driver.stdout | default('') | length > 0
      register: clevis_initramfs_modules_changed

    - name: set DEVICE in initramfs.conf
      lineinfile:
        path: /etc/initramfs-tools/initramfs.conf
        regexp: '^DEVICE='
        line: "DEVICE={{ hw_iface }}"
      register: clevis_initramfs_device_changed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)

    - name: set IP in initramfs.conf with device and dhcp
      lineinfile:
        path: /etc/initramfs-tools/initramfs.conf
        regexp: '^IP='
        line: "IP=:::::{{ hw_iface }}:dhcp"
        insertafter: '^DEVICE='
      register: clevis_initramfs_ip_changed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)

    # --- Clean up stale initramfs netplan artifacts ---
    # The initramfs init script calls configure_networking() AFTER local-bottom,
    # so the cleanup must be in init-bottom (which runs after configure_networking).
    # configure_networking() writes /run/netplan/<iface>.yaml which persists into
    # userspace and causes netplan generate to re-enable DHCP on OVS bridge ports.

    - name: remove old local-bottom cleanup-netplan script (wrong location)
      file:
        path: /etc/initramfs-tools/scripts/local-bottom/cleanup-netplan
        state: absent
      register: clevis_cleanup_old_removed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)

    - name: deploy initramfs init-bottom cleanup-netplan script
      copy:
        src: initramfs_local-bottom_cleanup-netplan
        dest: /etc/initramfs-tools/scripts/init-bottom/cleanup-netplan
        owner: root
        group: root
        mode: '0755'
      register: clevis_cleanup_netplan_changed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)

    # --- Ensure dhcpcd is bundled into the initramfs ---
    # The dhcp-release script below needs a release-capable DHCP client in the
    # initramfs. Ubuntu's dhcpcd-base ships its own hook
    # (/usr/share/initramfs-tools/hooks/dhcpcd); Raspberry Pi (dhcpcd5) and Debian
    # Trixie (dhcpcd-base) do NOT. We therefore deploy our own hook ONLY when the
    # packaged one is absent, so we never shadow/duplicate the vendor hook.

    - name: check for a package-supplied dhcpcd initramfs hook
      stat:
        path: /usr/share/initramfs-tools/hooks/dhcpcd
      register: clevis_vendor_dhcpcd_hook
      check_mode: false
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - clevis_dhcp_release_enabled | default(true) | bool

    - name: deploy fallback initramfs hook to bundle dhcpcd (no vendor hook present)
      copy:
        src: initramfs_hooks_dhcpcd
        dest: /etc/initramfs-tools/hooks/dhcpcd
        owner: root
        group: root
        mode: '0755'
      register: clevis_dhcpcd_hook_changed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - clevis_dhcp_release_enabled | default(true) | bool
        - not (clevis_vendor_dhcpcd_hook.stat.exists | default(false))

    - name: remove fallback dhcpcd initramfs hook (vendor hook present or release disabled)
      file:
        path: /etc/initramfs-tools/hooks/dhcpcd
        state: absent
      register: clevis_dhcpcd_hook_removed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - >-
          (not (clevis_dhcp_release_enabled | default(true) | bool)) or
          (clevis_vendor_dhcpcd_hook.stat.exists | default(false))

    # --- Release the boot-time DHCP lease before switch_root ---
    # klibc ipconfig obtains but never releases the clevis/tang lease, so the
    # upstream DHCP server keeps reflecting the host under the stale boot IP via
    # mDNS (<host>.local / <host>.fritz.box). This init-bottom script uses the
    # initramfs' dhcpcd to send a proper DHCPRELEASE. Gate: clevis_dhcp_release_enabled.

    - name: deploy initramfs init-bottom dhcp-release script
      copy:
        src: initramfs_init-bottom_dhcp-release
        dest: /etc/initramfs-tools/scripts/init-bottom/dhcp-release
        owner: root
        group: root
        mode: '0755'
      register: clevis_dhcp_release_changed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - clevis_dhcp_release_enabled | default(true) | bool

    - name: remove initramfs init-bottom dhcp-release script (disabled)
      file:
        path: /etc/initramfs-tools/scripts/init-bottom/dhcp-release
        state: absent
      register: clevis_dhcp_release_removed
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - not (clevis_dhcp_release_enabled | default(true) | bool)

    # --- Rebuild initramfs ---

    - name: rebuild initramfs for all kernels
      command: update-initramfs -u -k all
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - >-
          (clevis_needs_bind | bool) or
          (clevis_initramfs_modules_changed is changed) or
          (clevis_initramfs_device_changed is changed) or
          (clevis_initramfs_ip_changed is changed) or
          (clevis_cleanup_netplan_changed is changed) or
          (clevis_cleanup_old_removed is changed) or
          (clevis_dhcp_release_changed is changed) or
          (clevis_dhcp_release_removed is changed) or
          (clevis_dhcpcd_hook_changed is changed) or
          (clevis_dhcpcd_hook_removed is changed)

    # Verify AFTER the rebuild, so the check reflects the freshly-built initramfs
    # (the fallback hook above only takes effect once update-initramfs has run).
    - name: verify dhcpcd is present in initramfs (required for dhcp-release)
      shell: lsinitramfs /boot/initrd.img-$(uname -r) 2>/dev/null | grep -cE 'sbin/dhcpcd$' || echo "0"
      register: clevis_dhcpcd_check
      changed_when: false
      check_mode: false
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - clevis_dhcp_release_enabled | default(true) | bool

    - name: warn if dhcpcd missing from initramfs (dhcp-release will no-op)
      debug:
        msg: >-
          WARNING — dhcpcd not found in the initramfs even after rebuild. The
          dhcp-release script needs it to send a DHCPRELEASE (klibc ipconfig cannot);
          the release will silently no-op. Check that dhcpcd is installed on the host
          so the fallback hook can copy it in.
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - clevis_dhcp_release_enabled | default(true) | bool
        - (clevis_dhcpcd_check.stdout | default('0') | trim | int) == 0


# --- dracut path (systemd-cryptsetup hosts, e.g. Ubuntu 26.04 without initramfs-tools) ---
# dracut injects kernel_cmdline from dracut.conf.d into the initrd (no GRUB edit). The dracut
# module clevis runs clevis-luks-askpass as a systemd password agent: it answers the same
# /run/systemd/ask-password requests as the console prompt and the clevis-keyfile agent, the
# first valid answer wins, crypttab stays untouched. No dhcp-release script is needed: the
# initrd network backend (NetworkManager / systemd-networkd) releases its own lease.

- name: tang on dracut (clevis-dracut, /etc/dracut.conf.d/90-clevis.conf, dracut rebuild)
  when:
    - clevis_has_luks | bool
    - wantsclevis_initramfs | default(true)
    - clevis_initramfs_generator == 'dracut'
  block:
    - name: deploy dracut config (clevis, network, ip=, NIC driver)
      template:
        src: etc_dracut.conf.d_90-clevis.conf.j2
        dest: /etc/dracut.conf.d/90-clevis.conf
        owner: root
        group: root
        mode: '0644'
      register: clevis_dracut_tang_conf_changed

    - name: rebuild initramfs for all kernels (dracut, tang)
      import_tasks: dracut_rebuild.yml
      when: >-
        (clevis_needs_bind | bool) or
        (clevis_dracut_tang_conf_changed is changed)

    - name: verify clevis, network and NIC driver in the dracut initramfs
      shell: |
        set -uo pipefail
        INITRD=$(ls /boot/initrd.img-"$(uname -r)" /boot/initramfs-"$(uname -r)".img 2>/dev/null | head -1 || true)
        if [ -z "$INITRD" ]; then echo "ERROR: no initrd found for $(uname -r)"; exit 1; fi
        echo "initrd: $INITRD"
        LIST=$(lsinitrd "$INITRD" 2>/dev/null)
        rc=0
        for f in usr/libexec/clevis-luks-askpass clevis-luks-askpass.path clevis-luks-askpass.service \
                 clevis-decrypt-tang clevis-decrypt-sss; do
          if grep -qE "(^|[[:space:]/])$f(\$|[[:space:]])" <<< "$LIST"; then echo "present: $f"
          else echo "ERROR: $f not in $INITRD"; rc=1; fi
        done
        if grep -qE 'NetworkManager|systemd-networkd|nm-initrd-generator|net-lib\.sh|dhclient' <<< "$LIST"; then
          echo "network backend: present"
        else echo "ERROR: no network backend (NetworkManager / systemd-networkd / net-lib.sh) in $INITRD"; rc=1; fi
        if [ -n "$DRIVER" ]; then
          if grep -qE "/$DRIVER\.ko" <<< "$LIST"; then echo "NIC driver $DRIVER: present"
          else echo "ERROR: NIC driver $DRIVER not in $INITRD"; rc=1; fi
        fi
        # the cmdline is baked in as etc/cmdline.d/*.conf; not critical if the layout differs
        CMD=$(for c in $(grep -oE 'etc/cmdline\.d/[^[:space:]]+' <<< "$LIST" | sort -u); do lsinitrd "$INITRD" -f "$c" 2>/dev/null; done)
        if grep -q 'rd\.neednet=1' <<< "$CMD"; then echo "cmdline: rd.neednet=1 present"
        else echo "WARN: rd.neednet=1 not found in etc/cmdline.d of $INITRD"; fi
        exit $rc
      args:
        executable: /bin/bash
      environment:
        DRIVER: "{{ clevis_net_driver.stdout | default('') | trim }}"
      register: clevis_dracut_tang_check
      changed_when: false
      check_mode: false

    - name: display dracut initramfs verification (tang)
      debug:
        msg: "{{ clevis_dracut_tang_check.stdout_lines }}"

# --- Deploy scripts ---

- name: deploy setup_clevis_tang.sh
  template:
    src: setup_clevis_tang.sh.j2
    dest: /root/setup_clevis_tang.sh
    mode: '0755'
    owner: root
    group: root
  when: clevis_has_luks | bool

- name: deploy tang_check_connection.sh
  copy:
    src: tang_check_connection.sh
    dest: /root/tang_check_connection.sh
    mode: '0755'
    owner: root
    group: root
  when: clevis_has_luks | bool

# --- Final verification (initramfs-tools; the dracut path verifies right after its rebuild) ---

- name: final verification on initramfs-tools
  when: clevis_initramfs_generator == 'initramfs-tools'
  block:
    - name: verify clevis hooks in initramfs
      shell: lsinitramfs /boot/initrd.img-$(uname -r) 2>/dev/null | grep -c clevis || echo "0"
      register: clevis_initramfs_check
      changed_when: false
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)

    - name: verify network driver in initramfs
      shell: lsinitramfs /boot/initrd.img-$(uname -r) 2>/dev/null | grep -c {{ clevis_net_driver.stdout }} || echo "0"
      register: clevis_driver_check
      changed_when: false
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
        - clevis_net_driver.stdout | default('') | length > 0

    - name: display final verification
      debug:
        msg:
          - "clevis hooks in initramfs: {{ clevis_initramfs_check.stdout }} files"
          - "network driver ({{ clevis_net_driver.stdout | default('n/a') }}) in initramfs: {{ clevis_driver_check.stdout | default('n/a') }} files"
          - "setup_clevis_tang.sh deployed to /root/"
          - "tang_check_connection.sh deployed to /root/"
          - "Check: /root/tang_check_connection.sh {{ clevis_luks_device }}"
          - "Rebind: /root/setup_clevis_tang.sh [PASSPHRASE]"
      when:
        - clevis_has_luks | bool
        - wantsclevis_initramfs | default(true)
