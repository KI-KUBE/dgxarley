---
# dracut_crypttab.yml
# (awk program: files/clevis_keyfile_crypttab.awk, unit-tested in tests/)
# Rewrites ONLY the /etc/crypttab line of mapper clevis_luks_mapper (dracut path of the
# keyfile fallback; imported for install and teardown with clevis_dracut_crypttab_field3):
#   field 2  kept
#   field 3  clevis_dracut_crypttab_field3 (embedded path | /<boot file>:UUID=<uuid> | USB form) if non-empty; empty = back to "none" if it was
#            one of our managed values, otherwise untouched
#   field 4  existing options kept; keyfile-timeout=<clevis_keyfile_dracut_keyfile_timeout>
#            ensured while a keyfile is set, removed when field 3 is none; never duplicated
# Fails loudly if the line is missing or field 3 holds an unknown keyfile (never clobber
# a foreign setup). One-time backup: /etc/crypttab.clevis-keyfile.bak. Registers
# clevis_dracut_crypttab (changed = "CHANGED" on stdout).

- name: edit /etc/crypttab line of the LUKS mapper
  shell: |
    set -euo pipefail
    NEW=$(mktemp /run/crypttab.clevis-keyfile.XXXXXX)
    trap 'rm -f "$NEW"' EXIT
    awk -v m="$MAPPER" -v want="$WANT" -v emb="$EMBED_VAL" -v usb="$USB_VAL" -v bootv="$BOOT_VAL" -v bootp="$BOOT_PREFIX" -v to="$TIMEOUT" "$AWKPROG" /etc/crypttab > "$NEW"
    if cmp -s "$NEW" /etc/crypttab; then echo UNCHANGED; exit 0; fi
    [ -e /etc/crypttab.clevis-keyfile.bak ] || cp -p /etc/crypttab /etc/crypttab.clevis-keyfile.bak
    cat "$NEW" > /etc/crypttab
    echo CHANGED
  args:
    executable: /bin/bash
  environment:
    AWKPROG: "{{ lookup('file', 'clevis_keyfile_crypttab.awk') }}"
    MAPPER: "{{ clevis_luks_mapper }}"
    WANT: "{{ clevis_dracut_crypttab_field3 }}"
    EMBED_VAL: "{{ clevis_keyfile_path }}"
    USB_VAL: "/{{ clevis_keyfile_usb_file }}:LABEL={{ clevis_keyfile_usb_label }}"
    BOOT_VAL: "{{ clevis_dracut_boot_value | default('') }}"
    BOOT_PREFIX: "/{{ clevis_keyfile_boot_file | regex_replace('^/+', '') }}:UUID="
    TIMEOUT: "{{ clevis_keyfile_dracut_keyfile_timeout }}"
  register: clevis_dracut_crypttab
  changed_when: "'CHANGED' in clevis_dracut_crypttab.stdout"
