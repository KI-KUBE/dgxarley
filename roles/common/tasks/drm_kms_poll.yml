---
# file: roles/common/tasks/drm_kms_poll.yml
# drm_kms_helper is built into the Ubuntu kernel, so modprobe.d options do not apply.
- name: check for GRUB drop-in directory
  stat:
    path: /etc/default/grub.d
  register: drm_kms_poll_grub_d

- name: manage zz-drm-kms-poll GRUB snippet
  copy:
    content: 'GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT drm_kms_helper.poll=0"'
    dest: /etc/default/grub.d/zz-drm-kms-poll.cfg
    owner: root
    group: root
    mode: '0644'
  notify: update grub
  when:
    - drm_kms_poll_grub_d.stat.isdir | default(false)
    - disable_drm_kms_poll | default(false)

- name: remove zz-drm-kms-poll GRUB snippet
  file:
    path: /etc/default/grub.d/zz-drm-kms-poll.cfg
    state: absent
  notify: update grub
  when:
    - drm_kms_poll_grub_d.stat.isdir | default(false)
    - not (disable_drm_kms_poll | default(false))

- name: disable DRM connector polling on the running kernel
  shell: |
    grep -qx N /sys/module/drm_kms_helper/parameters/poll && exit 0
    echo N > /sys/module/drm_kms_helper/parameters/poll && echo changed
  register: drm_kms_poll_runtime
  changed_when: "'changed' in drm_kms_poll_runtime.stdout"
  when: disable_drm_kms_poll | default(false)
