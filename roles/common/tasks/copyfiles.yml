---
- name: copy template /etc/rc.local
  template:
    src: "rc_local.j2"
    dest: "/etc/rc.local"
    owner: root
    group: root
    mode: '0755'
  when:
    - skip_common_rclocal is not defined or not skip_common_rclocal

- name: Assert lan_ingress ports are open on the target host
  tags: iptables
  ansible.builtin.assert:
    that:
      - lan_ingress.tcp_ports | difference(iptables_public_tcp_ports) | length == 0
      - lan_ingress.tcp_port_map | default([]) | map(attribute='to_port') | difference(iptables_public_tcp_ports) | length == 0
    fail_msg: "lan_ingress.tcp_ports and tcp_port_map to_ports must be in iptables_public_tcp_ports on {{ inventory_hostname }}"
    quiet: true
  when:
    - lan_ingress.enabled | default(false) | bool
    - inventory_hostname == lan_ingress.target_host

- name: Assert lan_ingress networks are not in localnets
  tags: iptables
  ansible.builtin.assert:
    that:
      - lan_ingress.networks | intersect((localnets | default([]) + localnets_k3sserver | default([])) | map(attribute='cidr') | list) | length == 0
    fail_msg: "lan_ingress.networks must not be in localnets or localnets_k3sserver"
    quiet: true
  when: lan_ingress.enabled | default(false) | bool

- name: Assert vpn_ingress is well-formed on the target host
  tags: iptables
  ansible.builtin.assert:
    that:
      - vpn_ingress.tcp_ports | length > 0
      - vpn_ingress.tcp_ports | map('type_debug') | unique | list == ['int']
      - vpn_ingress.networks | length > 0
      - vpn_ingress.networks | reject('match', '^\\d+\\.\\d+\\.\\d+\\.\\d+/\\d+$') | list | length == 0
      - vpn_ingress.networks | intersect((localnets | default([]) + localnets_k3sserver | default([])) | map(attribute='cidr') | list) | length == 0
    fail_msg: "vpn_ingress.tcp_ports must be non-empty ints; vpn_ingress.networks must be non-empty IPv4 CIDRs outside localnets and localnets_k3sserver"
    quiet: true
  when:
    - vpn_ingress.enabled | default(false) | bool
    - inventory_hostname == vpn_ingress.target_host

- name: Assert hub_ingress is complete when enabled
  tags: iptables
  ansible.builtin.assert:
    that:
      - hub_ingress.bind_address | length > 0
      - hub_ingress.source_ips | length > 0
    fail_msg: "hub_ingress.enabled requires bind_address and source_ips"
    quiet: true
  when: hub_ingress.enabled | default(false) | bool

- name: copy iptables.sh from templates
  tags: iptables
  template:
    src: "iptables.sh.j2"
    dest: "/root/iptables.sh"
    owner: root
    group: root
    mode: '0755'
  notify:
    - execiptablessh
    - savetablesandipsets
  when:
    - skip_common_iptables is not defined or not skip_common_iptables

- name: copy script templates
  template:
    src: "{{ item }}.j2"
    dest: "/root/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  with_items:
    - ipsetgeoblock.sh
    - ipsetgeoallow.sh
  notify:
    - execrootscripts
    - savetablesandipsets

- name: copy root dotfiles
  # Config files, not scripts → 0644 (non-executable) and NO iptables-handler notify
  # (editing .bashrc/.tmux.conf has nothing to do with re-running the root scripts).
  # Own `dotfiles` tag (in addition to the inherited `iptables` import tag) so the
  # dotfiles can be pushed on their own: `--tags dotfiles`, without touching iptables.
  tags: dotfiles
  copy:
    src: "{{ item }}"
    dest: "/root/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  with_items:
    - .bashrc
    - .vimrc
    - .tmux.conf

- name: copy root helper scripts
  copy:
    src: "{{ item }}"
    dest: "/root/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  with_items:
    - blacklist.sh
    - blockbadhosts_ipset.sh
    - savetablesandipsets.sh
  notify:
    - execrootscripts
    - savetablesandipsets

- name: copy dyndns_ipset_iptables.sh from templates
  tags: iptables
  template:
    src: "dyndns_ipset_iptables.sh.j2"
    dest: "/root/dyndns_ipset_iptables.sh"
    owner: root
    group: root
    mode: '0755'
  when: dyndns_hostname is defined

- name: copy ip6tables_setup.sh from templates
  tags: iptables
  template:
    src: "ip6tables_setup.sh.j2"
    dest: "/root/ip6tables_setup.sh"
    owner: root
    group: root
    mode: '0755'
  notify:
    - execip6tablessh
    - savetablesandipsets
