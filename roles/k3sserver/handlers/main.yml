---
# handlers file for k3sserver
- name: restart rsyslog
  service:
    name: rsyslog
    state: restarted

- name: restart haproxy
  service:
    name: haproxy
    state: restarted

- name: sysctl reload
  command: sysctl -p

# One node at a time; KillMode=process keeps the containers running across the restart.
- name: restart k3s
  service:
    name: "{{ 'k3s' if isk3smaster | default(false) else 'k3s-agent' }}"
    state: restarted
  throttle: 1
