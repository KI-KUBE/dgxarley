- name: check if /etc/rancher/k3s/config.yaml exists
  stat:
    path: "/etc/rancher/k3s/config.yaml"
  register: k3sconf


- name: copy k3s_install_server.sh script
  template:
    src: "k3s_install_server.sh.j2"
    dest: "/root/k3s_install_server.sh"
    owner: root
    group: root
    mode: "u=rwx,g=rw,o="
  when:
    - k3sconf.stat.exists == True
    - isk3smaster is defined
    - isk3smaster
  register: k3s_install_server

- name: execute curl installer for k3s-server
  shell: "/root/k3s_install_server.sh"
  args:
    chdir: /root
  when:
    - k3sconf.stat.exists == True
    - isk3smaster is defined
    - isk3smaster
    - (services is defined and 'k3s.service' not in services) or k3s_install_server.changed


- name: ensure /var/lib/rancher/k3s/server/manifests exists
  file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - isk3smaster is defined
    - isk3smaster

- name: copy traefik-extend.yaml to k3smaster
  template:
    src: "traefik-extend.yaml.j2"
    dest: "/var/lib/rancher/k3s/server/manifests/traefik-extend.yaml"
  tags:
    - traefik-extend
  when:
    - isk3smaster is defined
    - isk3smaster
  # notify: restart k3s

# helm upgrade does not reliably remove the Service when it is disabled
- name: delete traefik Service
  command: k3s kubectl -n kube-system delete svc traefik --ignore-not-found
  register: traefik_svc_delete
  changed_when: traefik_svc_delete.stdout | length > 0
  tags:
    - traefik-extend
  when:
    - isk3smaster is defined
    - isk3smaster
    - not ansible_check_mode

# Traefik runs on hostPorts: a Service is unnecessary, its NodePorts would collide with their DNAT on 127.0.0.1
- name: assert traefik has no Service
  command: k3s kubectl -n kube-system get svc traefik --ignore-not-found -o name
  register: traefik_svc
  until: traefik_svc.stdout == ''
  retries: 36
  delay: 5
  changed_when: false
  tags:
    - traefik-extend
  when:
    - isk3smaster is defined
    - isk3smaster
    - not ansible_check_mode

- name: copy traefik-netpol.yaml to k3smaster
  copy:
    src: "traefik-netpol.yaml"
    dest: "/var/lib/rancher/k3s/server/manifests/traefik-netpol.yaml"
  tags:
    - traefik-netpol
  when:
    - isk3smaster is defined
    - isk3smaster

# coredns, metrics-server and local-storage are flat Addons, HelmChartConfig has no effect; see k8s_infra tags coredns + k3s_addons.
- name: remove inert HelmChartConfig manifests
  file:
    path: "/var/lib/rancher/k3s/server/manifests/{{ item }}"
    state: absent
  loop:
    - metrics-server-extend.yaml
    - local-path-provisioner-extend.yaml
    - coredns-extend.yaml
  tags:
    - extend-cleanup
  when:
    - isk3smaster is defined
    - isk3smaster

- name: slurp node-token from k3s-master
  slurp:
      src: /var/lib/rancher/k3s/server/node-token
  register: slurpedtoken
  delegate_to: "{{ groups['k3sserver'] | map('extract', hostvars) | selectattr('isk3smaster', 'defined') | selectattr('isk3smaster') | map(attribute='inventory_hostname') | first }}"
  run_once: yes

- name: set info for others
  set_fact:
      k3stoken: "{{ slurpedtoken.content | b64decode }}"
  delegate_to: "{{ item }}"
  loop: "{{ ansible_play_batch }}"
  run_once: yes

- name: print k3s token to screen
  debug:
    msg: "k3stoken: {{ k3stoken }}"
  when:
    - k3stoken is defined

- name: copy k3s_install_agent.sh script
  template:
    src: "k3s_install_agent.sh.j2"
    dest: "/root/k3s_install_agent.sh"
    owner: root
    group: root
    mode: "u=rwx,g=rw,o="
  when:
    - k3sconf.stat.exists == True
    - isk3smaster is not defined or not isk3smaster
  register: k3s_install_agent



- name: execute curl installer for k3s-agent
  shell: "/root/k3s_install_agent.sh"
  args:
    chdir: /root
  when:
    - k3sconf.stat.exists == True
    - services is defined
    - isk3smaster is not defined or not isk3smaster
    - (services is defined and 'k3s-agent.service' not in services) or k3s_install_agent.changed



