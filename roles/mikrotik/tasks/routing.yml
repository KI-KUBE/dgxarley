---
- name: Ensure default route
  community.routeros.command:
    commands:
      - >-
        :if ([:len [/ip/route/find dst-address=0.0.0.0/0]] = 0)
        do={ /ip/route/add dst-address=0.0.0.0/0 gateway={{ _mikrotik_routing.default_gateway }} }
        else={ /ip/route/set [find dst-address=0.0.0.0/0] gateway={{ _mikrotik_routing.default_gateway }} }
  changed_when: false
  when: _mikrotik_uplink.interface | length == 0

- name: Ensure DNS servers
  community.routeros.command:
    commands:
      - /ip/dns/set servers={{ _mikrotik_routing.dns_servers | join(',') }}
  changed_when: false
  when: _mikrotik_routing.dns_servers | default([]) | length > 0

- name: Ensure DNS remote requests
  community.routeros.command:
    commands:
      - /ip/dns/set allow-remote-requests={{ 'yes' if _mikrotik_routing.allow_remote_dns_requests | bool else 'no' }}
  changed_when: false
  when: _mikrotik_routing.allow_remote_dns_requests is not none

# The resolver answers on every interface with an address; only the bridge (internal LAN) may query it.
- name: Ensure DNS input drop outside the bridge
  community.routeros.command:
    commands:
      - >-
        :if ([:len [/ip/firewall/filter/find comment="{{ _comment }}"]] = 0)
        do={ :local top [:pick [/ip/firewall/filter/find chain=input dynamic=no] 0];
        :if ([:typeof $top] = "nil")
        do={ /ip/firewall/filter/add {{ _rule }} comment="{{ _comment }}" }
        else={ /ip/firewall/filter/add {{ _rule }} comment="{{ _comment }}" place-before=$top } }
        else={ /ip/firewall/filter/set [find comment="{{ _comment }}"] {{ _rule }} }
  vars:
    _comment: "{{ mikrotik_object_prefix }}-dns input drop {{ item }}"
    _rule: "chain=input action=drop protocol={{ item }} dst-port=53 in-interface=!{{ _mikrotik_bridge.name }}"
  loop: [udp, tcp]
  changed_when: false
  when: _mikrotik_routing.allow_remote_dns_requests | bool

- name: Remove DNS input drop
  community.routeros.command:
    commands:
      - /ip/firewall/filter/remove [find comment~"^{{ mikrotik_object_prefix }}-dns input drop "]
  changed_when: false
  when:
    - _mikrotik_routing.allow_remote_dns_requests is not none
    - not _mikrotik_routing.allow_remote_dns_requests | bool

- name: Expand static DNS aliases
  ansible.builtin.set_fact:
    _mikrotik_dns_records: >-
      {%- set out = [] -%}
      {%- for e in _mikrotik_routing.dns_static -%}
      {%- for n in [e.name] + (e.aliases | default([])) -%}
      {%- set _ = out.append({'name': n, 'address': e.address}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Assert static DNS entries
  ansible.builtin.assert:
    that:
      - _mikrotik_dns_records | map(attribute='name') | reject('match', '^[A-Za-z0-9][A-Za-z0-9.-]*$') | list | length == 0
      - _mikrotik_dns_records | map(attribute='address') | reject('match', '^\\d+\\.\\d+\\.\\d+\\.\\d+$') | list | length == 0
      - _mikrotik_dns_records | map(attribute='name') | unique | length == _mikrotik_dns_records | length
    fail_msg: "dns_static: one entry per name (letters, digits, . and -) with an IPv4 address"
    quiet: true

- name: Ensure static DNS entries
  community.routeros.command:
    commands:
      - >-
        :if ([:len [/ip/dns/static/find name="{{ item.name }}"]] = 0)
        do={ /ip/dns/static/add name="{{ item.name }}" type=A address={{ item.address }} comment="{{ _comment }}" }
        else={ /ip/dns/static/set [find name="{{ item.name }}"] type=A address={{ item.address }} comment="{{ _comment }}" }
  vars:
    _comment: "{{ mikrotik_object_prefix }}-dns static {{ item.name }}"
  loop: "{{ _mikrotik_dns_records }}"
  loop_control:
    label: "{{ item.name }}: {{ item.address }}"
  changed_when: false

# The console echoes the command, wrapped at terminal width, into stdout; the dns| marker separates the lines.
- name: Read static DNS entries
  community.routeros.command:
    commands:
      - ':foreach i in=[/ip/dns/static/find comment~"^{{ mikrotik_object_prefix }}-dns static "] do={ :put ("dns|" . [/ip/dns/static/get $i comment]) }'
  register: _dns_static
  changed_when: false
  check_mode: false

- name: Remove stale static DNS entries
  community.routeros.command:
    commands:
      - /ip/dns/static/remove [find comment="{{ item }}"]
  loop: >-
    {{ _dns_static.stdout_lines[0] | map('trim') | select('match', '^dns\|' ~ (_prefix | regex_escape))
       | map('regex_replace', '^dns\|', '') | reject('in', _wanted) | list }}
  vars:
    _prefix: "{{ mikrotik_object_prefix }}-dns static "
    _wanted: "{{ _mikrotik_dns_records | map(attribute='name') | map('regex_replace', '^', _prefix) | list }}"
  changed_when: true
