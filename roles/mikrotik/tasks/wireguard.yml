---
- name: Assert WireGuard gates
  ansible.builtin.assert:
    that:
      - not (mikrotik_wireguard_enabled | default(false) and mikrotik_wireguard_teardown | default(false))
      - mikrotik_object_prefix is match('^[A-Za-z0-9_-]+$')
    fail_msg: "mikrotik_wireguard_enabled and mikrotik_wireguard_teardown are mutually exclusive; mikrotik_object_prefix allows only letters, digits, - and _"
    quiet: true

# Deletes the interface and with it the private key: re-enabling yields a new public key for the hub.
- name: Remove hub WireGuard objects
  community.routeros.command:
    commands:
      - /ip/firewall/filter/remove [find comment~"^{{ mikrotik_wireguard_comment }}"]
      - /ip/firewall/nat/remove [find comment~"^{{ mikrotik_wireguard_comment }}"]
      - /ip/address/remove [find comment~"^{{ mikrotik_wireguard_comment }}"]
      - /interface/wireguard/peers/remove [find comment~"^{{ mikrotik_wireguard_comment }}"]
      - /interface/wireguard/remove [find comment~"^{{ mikrotik_wireguard_comment }}"]
  changed_when: false
  when: mikrotik_wireguard_teardown | default(false)

- name: Disable hub WireGuard interface
  community.routeros.command:
    commands:
      - >-
        :if ([:len [/interface/wireguard/find comment="{{ mikrotik_wireguard_comment }}"]] > 0)
        do={ /interface/wireguard/set [find comment="{{ mikrotik_wireguard_comment }}"] disabled=yes }
  changed_when: false
  when:
    - not (mikrotik_wireguard_enabled | default(false))
    - not (mikrotik_wireguard_teardown | default(false))

- name: Configure hub WireGuard client
  when: mikrotik_wireguard_enabled | default(false)
  block:
    - name: Assert WireGuard parameters
      ansible.builtin.assert:
        that:
          - mikrotik_wireguard_hub_endpoint | length > 0
          - mikrotik_wireguard_hub_public_key | length > 0
          - mikrotik_wireguard_tunnel_address | length > 0
          - mikrotik_wireguard_ops_subnet | length > 0
          - not (mikrotik_wireguard_forward_lan | default(false)) or mikrotik_wireguard_forward_lans | length > 0
          - mikrotik_wireguard_forward_lans | reject('match', '^\\d+\\.\\d+\\.\\d+\\.\\d+/\\d+$') | list | length == 0
        fail_msg: "WireGuard: hub endpoint/key, tunnel address and ops subnet are required; forward_lan needs mikrotik_wireguard_forward_lans as IPv4 CIDRs"
        quiet: true

    - name: Ensure WireGuard interface
      community.routeros.command:
        commands:
          - >-
            :if ([:len [/interface/wireguard/find comment="{{ mikrotik_wireguard_comment }}"]] = 0)
            do={ /interface/wireguard/add name={{ mikrotik_wireguard_interface }}
            comment="{{ mikrotik_wireguard_comment }}" }
            else={ /interface/wireguard/set [find comment="{{ mikrotik_wireguard_comment }}"] disabled=no }
      changed_when: false

    - name: Ensure WireGuard hub peer
      community.routeros.command:
        commands:
          - >-
            :if ([:len [/interface/wireguard/peers/find comment="{{ mikrotik_wireguard_comment }}"]] = 0)
            do={ /interface/wireguard/peers/add interface={{ mikrotik_wireguard_interface }}
            public-key="{{ mikrotik_wireguard_hub_public_key }}"
            endpoint-address={{ mikrotik_wireguard_hub_endpoint.split(':')[0] }}
            endpoint-port={{ mikrotik_wireguard_hub_endpoint.split(':')[-1] }}
            allowed-address={{ mikrotik_wireguard_ops_subnet }}
            persistent-keepalive={{ mikrotik_wireguard_keepalive }}
            comment="{{ mikrotik_wireguard_comment }}" }
            else={ /interface/wireguard/peers/set [find comment="{{ mikrotik_wireguard_comment }}"]
            interface={{ mikrotik_wireguard_interface }}
            public-key="{{ mikrotik_wireguard_hub_public_key }}"
            endpoint-address={{ mikrotik_wireguard_hub_endpoint.split(':')[0] }}
            endpoint-port={{ mikrotik_wireguard_hub_endpoint.split(':')[-1] }}
            allowed-address={{ mikrotik_wireguard_ops_subnet }}
            persistent-keepalive={{ mikrotik_wireguard_keepalive }} }
      changed_when: false

    - name: Ensure WireGuard tunnel address
      community.routeros.command:
        commands:
          - >-
            :if ([:len [/ip/address/find comment="{{ mikrotik_wireguard_comment }}"]] = 0)
            do={ /ip/address/add address={{ mikrotik_wireguard_tunnel_address }}
            interface={{ mikrotik_wireguard_interface }} comment="{{ mikrotik_wireguard_comment }}" }
            else={ /ip/address/set [find comment="{{ mikrotik_wireguard_comment }}"]
            address={{ mikrotik_wireguard_tunnel_address }}
            interface={{ mikrotik_wireguard_interface }} }
      changed_when: false

    - name: Ensure tunnel traffic is not NATed
      community.routeros.command:
        commands:
          - >-
            :if ([:len [/ip/firewall/nat/find comment="{{ mikrotik_wireguard_comment }} no-nat"]] = 0)
            do={ :do { /ip/firewall/nat/add chain=srcnat action=accept
            out-interface={{ mikrotik_wireguard_interface }}
            comment="{{ mikrotik_wireguard_comment }} no-nat" place-before=0 } on-error={
            /ip/firewall/nat/add chain=srcnat action=accept
            out-interface={{ mikrotik_wireguard_interface }}
            comment="{{ mikrotik_wireguard_comment }} no-nat" } }
            else={ /ip/firewall/nat/set [find comment="{{ mikrotik_wireguard_comment }} no-nat"]
            out-interface={{ mikrotik_wireguard_interface }} }
      changed_when: false

    - name: Ensure WireGuard filter rules
      community.routeros.command:
        commands:
          - >-
            :if ([:len [/ip/firewall/filter/find comment="{{ item.comment }}"]] = 0)
            do={ :do { /ip/firewall/filter/add {{ item.rule }}
            comment="{{ item.comment }}" place-before=0 } on-error={
            /ip/firewall/filter/add {{ item.rule }}
            comment="{{ item.comment }}" } }
            else={ /ip/firewall/filter/set [find comment="{{ item.comment }}"]
            {{ item.rule }} }
      loop:
        - comment: "{{ mikrotik_wireguard_comment }} forward drop from tunnel"
          rule: "chain=forward action=drop in-interface={{ mikrotik_wireguard_interface }}"
        - comment: "{{ mikrotik_wireguard_comment }} forward drop to tunnel"
          rule: "chain=forward action=drop out-interface={{ mikrotik_wireguard_interface }}"
        - comment: "{{ mikrotik_wireguard_comment }} input drop"
          rule: "chain=input action=drop in-interface={{ mikrotik_wireguard_interface }}"
        - comment: "{{ mikrotik_wireguard_comment }} input icmp"
          rule: >-
            chain=input action=accept protocol=icmp
            in-interface={{ mikrotik_wireguard_interface }}
            src-address={{ mikrotik_wireguard_ops_subnet }}
        - comment: "{{ mikrotik_wireguard_comment }} input mgmt"
          rule: >-
            chain=input action=accept protocol=tcp
            dst-port={{ mikrotik_wireguard_input_tcp_ports | join(',') }}
            in-interface={{ mikrotik_wireguard_interface }}
            src-address={{ mikrotik_wireguard_ops_subnet }}
      loop_control:
        label: "{{ item.comment }}"
      changed_when: false

    - name: Remove tunnel-to-LAN forward rules
      community.routeros.command:
        commands:
          - /ip/firewall/filter/remove [find comment~"^{{ mikrotik_wireguard_comment }}-fwd"]
      changed_when: false

    - name: Ensure tunnel-to-LAN forward rules
      community.routeros.command:
        commands:
          - >-
            :do { /ip/firewall/filter/add chain=forward action=accept
            in-interface={{ mikrotik_wireguard_interface }}
            src-address={{ mikrotik_wireguard_ops_subnet }}
            dst-address={{ item }} comment="{{ mikrotik_wireguard_comment }}-fwd {{ item }}"
            place-before=0 } on-error={ /ip/firewall/filter/add chain=forward
            action=accept in-interface={{ mikrotik_wireguard_interface }}
            src-address={{ mikrotik_wireguard_ops_subnet }}
            dst-address={{ item }} comment="{{ mikrotik_wireguard_comment }}-fwd {{ item }}" }
      loop: "{{ mikrotik_wireguard_forward_lans }}"
      changed_when: false
      when: mikrotik_wireguard_forward_lan | default(false)

    - name: Ensure tunnel return traffic rule
      community.routeros.command:
        commands:
          - >-
            :do { /ip/firewall/filter/add chain=forward action=accept
            out-interface={{ mikrotik_wireguard_interface }}
            dst-address={{ mikrotik_wireguard_ops_subnet }}
            connection-state=established,related
            comment="{{ mikrotik_wireguard_comment }}-fwd established" place-before=0 } on-error={
            /ip/firewall/filter/add chain=forward action=accept
            out-interface={{ mikrotik_wireguard_interface }}
            dst-address={{ mikrotik_wireguard_ops_subnet }}
            connection-state=established,related comment="{{ mikrotik_wireguard_comment }}-fwd established" }
      changed_when: false
      when: mikrotik_wireguard_forward_lan | default(false)

    # place-before=0 silently falls back to append, so the resulting order has to be checked.
    - name: Read firewall rule order
      community.routeros.command:
        commands:
          - ':foreach i in=[/ip/firewall/filter/find chain=forward] do={ :put [/ip/firewall/filter/get $i comment] }'
          - ':foreach i in=[/ip/firewall/filter/find chain=input] do={ :put [/ip/firewall/filter/get $i comment] }'
          - ':foreach i in=[/ip/firewall/nat/find chain=srcnat] do={ :put ([/ip/firewall/nat/get $i action] . "|" . [/ip/firewall/nat/get $i comment]) }'
      register: mikrotik_wireguard_rule_order
      changed_when: false
      check_mode: false

    - name: Assert firewall rule order
      vars:
        _fwd: "{{ mikrotik_wireguard_rule_order.stdout_lines[0] | map('trim') | list }}"
        _in: "{{ mikrotik_wireguard_rule_order.stdout_lines[1] | map('trim') | list }}"
        _nat: "{{ mikrotik_wireguard_rule_order.stdout_lines[2] | map('trim') | list }}"
        _nat_masq: "{{ _nat | select('match', '^(masquerade|src-nat)\\|') | list }}"
      ansible.builtin.assert:
        that:
          - _in.index('{{ mikrotik_wireguard_comment }} input icmp') < _in.index('{{ mikrotik_wireguard_comment }} input drop')
          - _in.index('{{ mikrotik_wireguard_comment }} input mgmt') < _in.index('{{ mikrotik_wireguard_comment }} input drop')
          - _fwd[_fwd.index('{{ mikrotik_wireguard_comment }} forward drop from tunnel'):] | select('match', '^{{ mikrotik_wireguard_comment }}-fwd ') | reject('equalto', '{{ mikrotik_wireguard_comment }}-fwd established') | list | length == 0
          - "'{{ mikrotik_wireguard_comment }}-fwd established' not in _fwd or _fwd.index('{{ mikrotik_wireguard_comment }}-fwd established') < _fwd.index('{{ mikrotik_wireguard_comment }} forward drop to tunnel')"
          - _nat_masq | length == 0 or _nat.index('accept|{{ mikrotik_wireguard_comment }} no-nat') < _nat.index(_nat_masq[0])
        fail_msg: "WireGuard firewall/NAT rules ended up below their drop/masquerade counterparts (place-before=0 fell back to append); move them up on the router"

    - name: Read WireGuard public key
      community.routeros.command:
        commands:
          - ':put [/interface/wireguard/get [find comment="{{ mikrotik_wireguard_comment }}"] public-key]'
      register: mikrotik_wireguard_pubkey
      changed_when: false
      check_mode: false

    - name: Show WireGuard hub peer data
      ansible.builtin.debug:
        msg:
          - "hub peer public key: {{ mikrotik_wireguard_pubkey.stdout[0] | trim }}"
          - "tunnel address: {{ mikrotik_wireguard_tunnel_address }}"
          - "hub peer LANs: {{ mikrotik_wireguard_forward_lans if mikrotik_wireguard_forward_lan | default(false) else [] }}"
