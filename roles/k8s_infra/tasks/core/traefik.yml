---
# Own Traefik instead of the k3s addon: DaemonSet on the node-role nodes, hostPorts on 127.0.0.1 for the local HAProxy, no Service.
- name: Create traefik namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ traefik.namespace }}"

# File = upstream docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml at tag traefik.version, source in its header
- name: Apply traefik CRDs
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    src: "{{ role_path }}/files/traefik/{{ traefik.version }}_kubernetes-crd-definition-v1.yml"

- name: Create traefik serviceaccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: traefik
        namespace: "{{ traefik.namespace }}"

# Rules from upstream kubernetes-crd-rbac.yml (same path/tag), without the ingress and pods rules (no Ingress provider, no OTel)
- name: Create traefik clusterrole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: traefik
      rules:
        - apiGroups: [""]
          resources: [services, secrets, nodes, configmaps]
          verbs: [get, list, watch]
        - apiGroups: [discovery.k8s.io]
          resources: [endpointslices]
          verbs: [list, watch]
        - apiGroups: [traefik.io]
          resources:
            - middlewares
            - middlewaretcps
            - ingressroutes
            - traefikservices
            - ingressroutetcps
            - ingressrouteudps
            - tlsoptions
            - tlsstores
            - serverstransports
            - serverstransporttcps
          verbs: [get, list, watch]

- name: Create traefik clusterrolebinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: traefik
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: traefik
      subjects:
        - kind: ServiceAccount
          name: traefik
          namespace: "{{ traefik.namespace }}"

# proxyProtocol.trustedIPs = cluster_cidr: other pods may only reach metrics, otherwise they could forge PROXY headers
- name: Create traefik networkpolicy
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: traefik-ingress-node-local-only
        namespace: "{{ traefik.namespace }}"
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        policyTypes:
          - Ingress
        ingress:
          - ports:
              - port: metrics

- name: Create traefik daemonset
  vars:
    traefik_static_args:
      - --entryPoints.metrics.address=:9100/tcp
      - --entryPoints.traefik.address=:8080/tcp
      - --entryPoints.web.address=:8181/tcp
      - --entryPoints.websecure.address=:4430/tcp
      - "--entryPoints.web.proxyProtocol.trustedIPs={{ cluster_cidr }}"
      - "--entryPoints.websecure.proxyProtocol.trustedIPs={{ cluster_cidr }}"
      - --entryPoints.websecure.http.tls=true
      - --api.dashboard=true
      - --ping=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --providers.kubernetescrd
      - --providers.kubernetescrd.allowEmptyServices=true
      - --log.level=INFO
    # empty list (base without vault): Traefik trusts nobody and overwrites X-Forwarded-For with the peer IP
    traefik_forwarded_args: >-
      {{ ['--entryPoints.web.forwardedHeaders.trustedIPs=' ~ (traefik_forwarded_trusted_ips | join(',')),
          '--entryPoints.websecure.forwardedHeaders.trustedIPs=' ~ (traefik_forwarded_trusted_ips | join(','))]
         if traefik_forwarded_trusted_ips | default([]) | length > 0 else [] }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: traefik
        namespace: "{{ traefik.namespace }}"
        labels:
          app.kubernetes.io/name: traefik
        annotations:
          keel.sh/policy: force
          keel.sh/match-tag: "true"
          keel.sh/pollSchedule: "@every 24h"
          keel.sh/trigger: poll
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: traefik
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        template:
          metadata:
            labels:
              app.kubernetes.io/name: traefik
            annotations:
              prometheus.io/path: /metrics
              prometheus.io/port: "9100"
              prometheus.io/scrape: "true"
          spec:
            serviceAccountName: traefik
            priorityClassName: system-cluster-critical
            terminationGracePeriodSeconds: 60
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role
                          operator: In
                          values:
                            - "{{ traefik.node_role }}"
            securityContext:
              runAsUser: 65532
              runAsGroup: 65532
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: traefik
                image: "traefik:{{ traefik.version }}"
                args: "{{ traefik_static_args + traefik_forwarded_args }}"
                ports:
                  - {name: metrics, containerPort: 9100, protocol: TCP}
                  - {name: traefik, containerPort: 8080, hostPort: 30808, hostIP: 127.0.0.1, protocol: TCP}
                  - {name: web, containerPort: 8181, hostPort: 30080, hostIP: 127.0.0.1, protocol: TCP}
                  - {name: websecure, containerPort: 4430, hostPort: 30443, hostIP: 127.0.0.1, protocol: TCP}
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: GOMAXPROCS
                    valueFrom:
                      resourceFieldRef:
                        resource: limits.cpu
                        divisor: "1"
                  - name: GOMEMLIMIT
                    value: 460MiB
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                readinessProbe:
                  httpGet:
                    path: /ping
                    port: 8080
                  initialDelaySeconds: 2
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 1
                livenessProbe:
                  httpGet:
                    path: /ping
                    port: 8080
                  initialDelaySeconds: 2
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                volumeMounts:
                  - {name: data, mountPath: /data}
                  - {name: tmp, mountPath: /tmp}
            volumes:
              - {name: data, emptyDir: {}}
              - {name: tmp, emptyDir: {}}

- name: Create traefik dashboard ingressroute on the traefik entrypoint
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: traefik-dashboard
        namespace: "{{ traefik.namespace }}"
      spec:
        entryPoints:
          - traefik
        routes:
          - kind: Rule
            match: PathPrefix(`/dashboard`) || PathPrefix(`/api`)
            services:
              - kind: TraefikService
                name: api@internal
