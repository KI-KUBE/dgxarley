---
# file: roles/tang/tasks/podman_tang.yml

- name: Read the podman version
  ansible.builtin.command: podman --version
  register: _tang_podman_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert podman is present and new enough for Quadlet
  # podman < 4.4 silently produces no unit from a .container file.
  ansible.builtin.assert:
    that:
      - _tang_podman_version.rc == 0
      - (_tang_podman_version.stdout | regex_search('[0-9]+\.[0-9]+') | default('0.0', true)) is version('4.4', '>=')
    fail_msg: >-
      podman >= 4.4 (Quadlet) required on {{ inventory_hostname }},
      found: {{ _tang_podman_version.stdout | default('no podman at all') }}.
      Set `wantspodman: true` for this host and run common.yml --tags podman first.
    success_msg: "podman OK: {{ _tang_podman_version.stdout }}"

- name: Ensure the Quadlet unit directory exists
  ansible.builtin.file:
    path: "{{ tang_quadlet_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Keys are generated by tangd on first start into this dir and never leave the host.
- name: Ensure the tang data directory exists
  ansible.builtin.file:
    path: "{{ tang_data_dir }}"
    state: directory
    owner: "{{ tang_data_uid }}"
    group: "{{ tang_data_gid }}"
    mode: "0750"

- name: Deploy the tang Quadlet unit
  ansible.builtin.template:
    src: tang.container.j2
    dest: "{{ tang_quadlet_dir }}/tang.container"
    owner: root
    group: root
    mode: "0644"
  notify: restart tang

- name: Ensure tang.service is running
  ansible.builtin.systemd:
    name: tang.service
    state: started
    daemon_reload: true

- name: Flush handlers before verifying tang
  ansible.builtin.meta: flush_handlers

- name: Verify tang serves its advertisement
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ tang_port }}/adv"
    status_code: 200
  register: _tang_adv
  retries: 12
  delay: 5
  until: _tang_adv.status == 200
  when: not ansible_check_mode
