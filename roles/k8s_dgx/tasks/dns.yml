---
# Only names without a record task of their own; every other app registers its record where it is deployed.
- name: Register DNS A records via nsupdate
  community.general.nsupdate:
    record: "{{ item }}.{{ dns_external_domain_suffix }}."
    type: A
    value: "{{ nsupdate_default.ingress_ip }}"
    state: present
  loop:
    - sglang
  loop_control:
    label: "{{ item }}.{{ dns_external_domain_suffix }}"
