---
# Model profile: vroomfondel/Ornith-1.0-35B-NVFP4-ModelOpt
# Loaded by include_vars in k8s_dgx role, merged into sglang_model_profiles.
#
# vroomfondel's NVIDIA-ModelOpt (0.45.0) NVFP4 export of
# deepreinforce-ai/Ornith-1.0-35B (a Qwen3.5-MoE *code* model, ~34.7B / ~3B active).
# SAME base checkpoint as the in-repo sibling ressl-ornith-1.0-35b-nvfp4.yml, but a
# DELIBERATELY MORE AGGRESSIVE recipe — see the quant note below. Same arch FORM as
# nvidia/Qwen3.6-35B-A3B-NVFP4 (Qwen3_5MoeForConditionalGeneration / qwen3_5_moe),
# so the closest working analogs in-repo are ressl-ornith-1.0-35b-nvfp4.yml and
# vroomfondel-qwen3.6-35b-a3b-nvfp4-modelopt.yml. License MIT (base_model MIT).
#
# ── ⚠️ THE KEY DIFFERENCE vs the ressl Ornith sibling: UNIFORM W4A4, ATTENTION
#      QUANTIZED ──────────────────────────────────────────────────────────────
# ressl-ornith-1.0-35b is EXPERTS-ONLY NVFP4 (`NVFP4_EXPERTS_ONLY_CFG`: only the
# 256 routed experts are FP4; linear_attn / full-attn / shared-expert / vision stay
# BF16). THIS vroomfondel export is UNIFORM W4A4: it ALSO quantizes the
# Gated-DeltaNet linear-attn path AND the full self-attn to W4A4 (weights AND
# activations FP4), keeping only lm_head + vision tower in BF16. Card, verbatim:
# "more aggressive than NVIDIA's own Qwen3.5-NVFP4 exports (MoE-only, attention kept
# in BF16)". FP8 KV cache is BAKED (unlike the ressl sibling's kv_cache_quant_algo:
# null) → kv_cache_dtype fp8_e4m3 here is checkpoint-mandated, not a free memory lever.
#
# This is EXACTLY the "wrong layer quantized" anti-pattern that the ressl profile
# and vroomfondel-qwen3.6-35b-a3b-nvfp4-modelopt.yml warn is a boot wall + NaN risk
# on this hybrid arch ([[reference_qwen35moe_linear_attn_nvfp4_unloadable]],
# [[reference_hybrid_uniform_w4a4_nan]]) — but here the author closed BOTH gaps with
# the two in-repo qwen3_5 patches (see PATCH DEPENDENCY) and the card reports it
# actually serves coherently on GB10. That is the whole point of this upload.
#
# ── PATCH DEPENDENCY (already in repo, self-inert, auto-mounted) ──────────────
# This checkpoint only loads + serves correctly because of two runtime source
# patches shipped in roles/k8s_dgx/files/sglang_patches/ (ConfigMap-mounted at
# /patches, run in filename order for EVERY sglang instance — no per-profile knob):
#   * p50_qwen35_attn_quant.py — qwen3_5.py hardcodes attention to BF16 the moment
#     quant_config is modelopt_fp4 (because every NVIDIA Qwen3.5/3.6 NVFP4 is
#     MoE-only). That forces a BF16 param for qkv_proj/in_proj_qkvz, then the loader
#     copies an NVFP4-packed uint8 chunk into it → shape assert / boot crash. The
#     patch lets ModelOptFp4Config.is_layer_excluded() decide per-prefix so the
#     quantized attention actually loads. Its docstring names THIS model explicitly.
#   * p51_qwen35_kvscale.py — loads the baked per-layer FP8 KV scales (QUALITY, not a
#     load-blocker): without it SGLang defaults FP8-KV scaling to 1.0 (baked scales
#     ~0.01–0.04 → 25–80× off, real precision loss).
# Both are INERT for NVIDIA MoE-only NVFP4 and for non-attention-quantized
# checkpoints, so they are safe to keep always-on. If a future image drops/moves
# qwen3_5.py, re-check these two before deploying this profile.
#
# ── ARCHITECTURE (Qwen3_5MoeForConditionalGeneration, model_type qwen3_5_moe) ──
#   * MULTIMODAL (text + vision). text: 40 layers, hidden 2048, head_dim 256,
#     num_attention_heads 16, num_key_value_heads 2, vocab 248320.
#   * Hybrid: layer_types = 3×linear_attention then 1×full_attention
#     (full_attention_interval 4) → 10 full-attn layers, 30 Gated-DeltaNet layers.
#     SGLang routes this through the mamba scheduler path (linear-attn recurrent
#     state, not KV) — only the 10 full-attn layers populate the KV pool, so KV is
#     modest even at 262K. Here BOTH attn paths are W4A4 (see key difference above).
#   * MoE: 256 experts, 8 routed + 1 shared per token, moe_intermediate_size 512,
#     shared_expert_intermediate_size 512.
#   * mrope, rope_theta 1e7, partial_rotary_factor 0.25,
#     max_position_embeddings 262144 (native, no YaRN).
#   * Vision: qwen3_5_moe ViT (depth 27, hidden 1152, out 2048), kept BF16.
#   * ⚠ mtp_num_hidden_layers: 1 is DECLARED in config, but the BASE
#     deepreinforce-ai/Ornith-1.0-35B ships NO trained MTP/nextn weights (verified
#     at the weight-index level for the ressl export of this SAME base: 0 mtp
#     tensors, decoder layers 0–39 only). Quantizing cannot create weights, so this
#     export has none either → NEXTN speculative UNAVAILABLE → speculative_enabled:
#     false (see below). This is the concrete difference from the Qwen3.6-35B-A3B
#     siblings (which DO have a working MTP head + validated NEXTN).
#   ~34.7B total / ~3B active; NVFP4 weights ≈ 21 GB → ≈ 5–6 GB/GPU at TP=4 — ample
#   KV/state headroom on GB10 128 GB unified.
#
# ── ✅ VALIDATION STATUS (per model card) ────────────────────────────────────
# Smoke-tested on SGLang GB10/sm121 (this cluster's target) with the two patches
# above: coherent output confirmed on German + arithmetic, "no word-salad observed
# on the Gated-DeltaNet linear-attention path despite it being quantized to W4A4."
# GSM8K 96.75% (387/400, 4-shot, temp 0.6, max 4500 tok). NOT independently re-run
# on THIS stack yet — treat throughput as UNMEASURED; do NOT quote numbers until a
# local matrix. The backend knobs below match the card's recommended SGLang flags.
# Top boot risks to watch, in order:
#   1. flashinfer_cutlass MoE "intermediate size required padding" assert
#      (moe_intermediate_size 512) → switch moe_runner_backend to flashinfer_trtllm
#      ([[reference_nvfp4_gated_moe_padding]]).
#   2. VISION-TOWER exclusion name-match: exclude lists the vision tower, but SGLang
#      can strip a name prefix when resolving is_layer_skipped → if it crashes in the
#      vision tower, p25_vlm_should_ignore_layer / the name-remap patch is the lead
#      ([[reference_vlm_compressed_tensors_ignore_mismatch]]). Vision path UNTESTED here.
_model_profile:
  "vroomfondel/Ornith-1.0-35B-NVFP4-ModelOpt":
    knowledge_cutoff: null       # base deepreinforce-ai/Ornith-1.0-35B — not disclosed
    release_date: null           # base Ornith-1.0-35B date unconfirmed; NVFP4 export by vroomfondel (modelopt 0.45.0)
    info_url: "https://huggingface.co/vroomfondel/Ornith-1.0-35B-NVFP4-ModelOpt"
    # ALTERNATIVES: BF16 source https://huggingface.co/deepreinforce-ai/Ornith-1.0-35B
    #   experts-only NVFP4 sibling https://huggingface.co/ressl/Ornith-1.0-35B-NVFP4
    #
    # SM121 sgl-kernel build required for NVFP4 on GB10. Pinned to the current
    # siblings' image (also the image carrying the p50/p51 qwen3_5 patches).
    sglang_image: "xomoxcc/dgx-spark-sglang:0.5.15-sm121"
    # UNIFORM W4A4 unified ModelOpt checkpoint (experts + linear_attn + full-attn all
    # FP4; lm_head + vision EXCLUDED) → standard modelopt_fp4 loader. NO modelopt_mixed
    # / _sgl_mixed_nvfp4_* patch (that is the nvidia MIXED_PRECISION upload's path).
    # Boots only WITH p50_qwen35_attn_quant (see PATCH DEPENDENCY in header).
    quantization: "modelopt_fp4"
    trust_remote_code: true
    # 262K native (mrope, no YaRN). Only the 10 full-attn layers use KV.
    context_length: 262144
    # FP8 KV is BAKED into this checkpoint (unlike the ressl experts-only sibling) →
    # fp8_e4m3 matches, and p51_qwen35_kvscale loads the baked per-layer scales.
    kv_cache_dtype: "fp8_e4m3"
    # 0.6 conservative first-contact (matches both 3.6-35B NVFP4 siblings); NVFP4
    # weights ~5-6 GB/GPU leave plenty of slack.
    mem_fraction_static: "0.6"
    nccl_transport: roce
    # Backend = the card's recommended SGLang flags (same as the validated same-arch
    # NVFP4 siblings): flashinfer_cutlass MoE runner + flashinfer attn +
    # flashinfer_cutlass FP4 GEMM. ⚠ if boot asserts on "intermediate size required
    # padding", switch the MoE runner to flashinfer_trtllm ([[reference_nvfp4_gated_moe_padding]]).
    moe_runner_backend: flashinfer_cutlass
    attention_backend: flashinfer
    fp4_gemm_backend: flashinfer_cutlass
    disable_deep_gemm: true
    # eager (disable_cuda_graph) is broken on any cutlass_moe_fp4 path (TURBOQUANT.md);
    # piecewise graphs crash at startup in this kernel family on SM121 → start safe.
    disable_cuda_graph: false
    disable_piecewise_cuda_graph: true
    pp_async_batch_depth: 0
    cuda_graph_max_bs: 32
    jit_max_jobs: 4
    ep_size: 1
    tp_size: 4
    num_experts: 256
    enable_eplb: false
    enable_expert_distribution_metrics: false
    # Multimodal (vision) attention backend. Empty → SGLang default. Bisect
    # (sdpa / fa3 / triton_attn / flashinfer_cudnn) if image requests crash; the
    # vision path is UNTESTED on this cluster.
    mm_attention_backend: ""
    reasoning_parser: "qwen3"
    # Card recommends --tool-call-parser qwen3_coder (the SGLang equivalent of the
    # Qwen3.5/3.6 XML tool-call format used by both 3.6-35B siblings → Honcho/Hermes-OK).
    tool_call_parser: "qwen3_coder"
    # Base Ornith generation defaults (mirrors the ressl sibling: temp 1.0 / top_p 0.95
    # / top_k 20). Card ran GSM8K at temp 0.6. thinking (default) + non-thinking via
    # chat_template_kwargs={"enable_thinking":false}.
    recommended_sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
    sampling_overrides: {}
    # ⚠ NO speculative decoding: config declares mtp_num_hidden_layers 1 but the base
    # Ornith-1.0-35B ships ZERO trained MTP/nextn weights (verified in the ressl
    # export's weight index for this SAME base) — enabling NEXTN would crash on
    # missing draft weights. Leave off unless a weight-index check of THIS export
    # shows mtp tensors (then mirror the 3.6-35B siblings: NEXTN s=2/draft=3 +
    # mamba_scheduler_strategy=extra_buffer + enable_spec_v2 + draft quant unquant).
    speculative_enabled: false
