---
# Model profile: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
# UNVALIDATED (2026-10-08): first-contact profile, no test matrix yet. Serving shape copied from the
# validated Nemotron-3-Super profile; model-specific values are from config.json / HF card.
_model_profile:
  "nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4":
    knowledge_cutoff: "2026-02"  # inherited from the parent Nemotron-3-Super (card gives none)
    release_date: "2026-07-06"
    info_url: "https://huggingface.co/nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4"
    litellm_input_cost_per_token: 0.00000008   # $0.08 per 1M, PROXY: nvidia/nemotron-3-super-120b-a12b (OpenRouter list price), checked 2026-10-10
    litellm_output_cost_per_token: 0.00000045  # $0.45 per 1M, PROXY: nvidia/nemotron-3-super-120b-a12b (OpenRouter list price), checked 2026-10-10
    # NemotronHPuzzleForCausalLM (model_type nemotron_h_puzzle), 75.3B total / 9.3B active, ~53.5 GB NVFP4 (modelopt MIXED_PRECISION).
    # 88 layers = 40 mamba2 + 40 moe + 8 attention, 512 routed experts in every MoE layer, moe_latent_size 1024,
    # ssm_state_size 96, 32 heads / 2 KV heads. Per-layer block_configs: expert FFN size 1280..2688, top-k 4..18.
    # Upstream SGLang has Puzzle support (NemotronHPuzzleForCausalLM, per-layer block_configs).
    load_format: "auto"
    nccl_transport: "roce"
    tp_size: 4
    # config caps at 262144; card claims 1M (NoPE attention, 512Ki recovery training). Raise both to go past 524288.
    context_length: 524288
    json_model_override_args: '{"max_position_embeddings": 524288}'
    quantization: "modelopt_fp4"
    trust_remote_code: true
    moe_runner_backend: "flashinfer_cutlass"
    kv_cache_dtype: "fp8_e4m3"
    mem_fraction_static: "0.75"
    attention_backend: "flashinfer"
    fp4_gemm_backend: "flashinfer_cutlass"
    jit_max_jobs: 4
    disable_piecewise_cuda_graph: true
    disable_cuda_graph: false
    cuda_graph_max_bs: 32
    # 32 slots x extra_buffer ratio ~5; 40 mamba layers with state 96 make slots cheaper than on Super.
    max_mamba_cache_size: 160
    pp_async_batch_depth: 0
    disable_deep_gemm: true
    reasoning_parser: "nemotron_3"
    tool_call_parser: "qwen3_coder"
    num_experts: 512
    # EP=4 is required: TP-sharded 2688-wide layers give 672/rank (672 % 64 = 32), tripping the NVFP4 padding crash.
    ep_size: 4
    recommended_sampling:
      temperature: 1.0
      top_p: 0.95
    speculative_enabled: true
    speculative_algo: EAGLE
    speculative_num_steps: 3
    speculative_num_draft_tokens: 4
    speculative_eagle_topk: 1
    speculative_draft_model_path: ""
