---
# Model profile: RadixArk/Qwen3.8-Flash-Next-NVFP4
# Loaded by include_vars in the k8s_dgx role, merged into sglang_model_profiles.
#
# STATUS 2026-09-16: FIRST SERVING RUNS ON THIS CLUSTER.
#   SUCCESS (current config): TP=4 on spark1-4 (nodes [1, 2, 3, 4], tp_size 4,
#   ep_size 4, mem_fraction_static 0.82, speculative_enabled false,
#   tool_call_parser qwen3_coder, p65 + p66 WITH p66's local TP4 widening of the
#   #36845 kernel contract to (6 q, 1 kv)). Same probe run twice: 0/32 collapsed,
#   8/8 tool calls parsed, decode ~35 tok/s single-stream (vs 26.8 at TP=2),
#   KV 2022656 tokens, max_running_requests 16. Empirical only, no FP32
#   reference comparison (deliberate decision).
#   SUCCESS (fallback): TP=2 on spark1+spark2 (nodes [1, 2], tp_size 2, ep_size 1,
#   mem_fraction_static 0.82, speculative_enabled false, tool_call_parser
#   qwen3_coder, runtime patches p65 + p66). 16-request probe (short prompts,
#   max_tokens 400, thinking on/off, with/without tools): 0/16 collapsed into
#   "!" (token 0), 4/4 tool calls parsed, decode 26.8 tok/s single-stream,
#   KV 525504 tokens, max_running_requests 16.
#   FAILED on the way there, same probe:
#     - TP4 EP4, NEXTN on, p65 FA4 fallback: 3/16 collapsed.
#     - TP2 EP1, NEXTN on, #36845 kernel (p66): 4/16 collapsed, starting after
#       tens to hundreds of good tokens, spec accept len stuck at 1.00.
#     - TP4 EP4, NEXTN OFF, p65 FA4 fallback (p66 routing gated off at TP4):
#       6/16 collapsed, several right after the first token ("We!!!..."),
#       including one tool request (no tool call returned). Decode ~31 tok/s.
#     => TWO independent collapse sources: NEXTN/MTP, and the TP4 FA4 QSA
#        decode fallback. Clean: #36845 kernel (TP2, or TP4 via p66 widening)
#        + NEXTN off. Never run TP4 without p66's kernel routing.
#   Boot prerequisites found on the way: kernel cma=128M on the sparks
#   (dgx_prepare tag cma, the 7.0.0-1019 CMA regression breaks NCCL RoCE with
#   ibv_reg_mr ENOMEM) and TP2 needs mem_fraction_static >= ~0.8 (0.60 left a
#   negative mamba-cache budget).
#   NOT on 0.5.19-sm121: the #36497 patch does not apply to v0.5.19 (15 files
#   with rejected hunks), so that recipe sets APPLY_QWEN4EXP_PR36497=0. #36497
#   itself was CLOSED unmerged; the architecture landed on upstream main via
#   #37500 (2026-09-08, after the v0.5.19 tag), plus "Enable NVIDIA NVFP4 on DGX
#   Spark" #39126 (2026-09-13, tested on nvidia/Qwen3.8-Flash-Next-NVFP4, not
#   this RadixArk export). Expected native in v0.5.20; re-check whether p65 is
#   still needed on that bump.
#
# HOW IT GETS SERVED HERE (two halves, deliberately split)
#   BUILD half: scripts/patches/sglang-0.5.18-sm121.recipe now sets
#     APPLY_QWEN4EXP_PR36497=1, which applies scripts/patches/sglang-qwen4exp-
#     pr36497.patch (upstream PR #36497, CLOSED unmerged, captured from the
#     upstream-owned branch qwen4-main-squashed @ 99c9362e; 94 files,
#     +18415/-86). That PR is the ONLY implementation of
#     Qwen4ExpForConditionalGeneration / model_type qwen4_exp: it is not in
#     v0.5.18 (main got it later via #37500). `git apply --check` and `patch --dry-run`
#     are clean against raw v0.5.18. So the STANDARD 0.5.18-sm121 tag carries
#     the model; there is no variant image.
#   RUNTIME half: roles/k8s_dgx/files/sglang_patches/p65_qsa_sm121_sparse_
#     decode.py. Two edits, and they are NOT symmetric (read that file before
#     touching either): a repair that makes QSA resolve a decode kernel on GB10
#     at all, and a DEFENSIVE veto that keeps it off a path which is silently
#     wrong here. The veto lives at runtime precisely so it survives image
#     re-bumps.
#   The image is built (spark5, 2026-08-28). Gate it with:
#     EXPECT_QWEN4EXP=1 scripts/verify_sglang_image.sh \
#         xomoxcc/dgx-spark-sglang:0.5.18-sm121 spark5
#   which fails unless qwen4_exp imports AND the SM121 veto is live.
#
# ############################################################################
# >>> THE ONE THING TO UNDERSTAND BEFORE SERVING THIS MODEL <<<
# ############################################################################
# QSA decode on GB10 has two upstream defects that pull in OPPOSITE directions,
# and the appealing fix for the first one causes the second:
#   (1) Without the flashinfer trtllm sparse-decode path, QSA falls through to
#       the pip flash_attn.cute interface, which does not compile on GB10:
#       "cutlass MLIRError: expects `coord` and shape of view are weakly
#       congruent". Backend init dies. Upstream #36558 (our exact hardware and
#       checkpoint) and #36531; root cause is the stock flash_attn_4-4.0.0b19
#       wheel shipping with the TMA-O varlen guard commented out (#36716 bug 3).
#   (2) But trtllm-gen attention kernels are SM100-only. On sm_121 they RUN and
#       emit NaN logits, which surfaces as long runs of token id 0 ("!") once
#       the context passes the sparse-selection boundary. Measured upstream on
#       2x DGX Spark TP=2 with REAL weights and THIS checkpoint, single-shot
#       cold prefill, greedy, thinking off, verdict = >=50 consecutive token-0:
#
#           prompt tokens   trtllm on        trtllm off + repaired fallback
#                120k       1/4 corrupt      6/6 clean
#                160k       1/4 corrupt      -
#                190k       2/4 corrupt      6/6 clean
#                210k       4/4 corrupt      6/6 clean
#                240k       -                6/6 clean (chunk 1024, mem 0.82)
#
#       It is SILENT (well-formed response, finish_reason length, nothing
#       logged), STOCHASTIC (about half the time at 190k, so any n=1 check
#       reads as a pass), and the engine does NOT recover: later requests fail
#       at any depth, /flush_cache does not clear it, only a restart does. A
#       three-prompt liveness canary passed 3/3 while the same server corrupted
#       100% of 210k requests.
#   SM120 (RTX Blackwell, cc 12.0) is the exact opposite case: there trtllm is
#   REQUIRED for correctness. This is per-SKU, not per-family, which is why the
#   upstream gate expression has been respelled three times in three days and
#   why p65 carries a spelling-independent veto rather than trusting it.
#
# WHAT THE CHECKPOINT IS (verified against HF 2026-08-27)
#   RadixArk NVIDIA-ModelOpt 0.46.0 NVFP4 export of Qwen/Qwen3.8-Flash-Next
#   (base repo created 2026-08-24, this quant 2026-08-25). 135.3 GB over 419
#   files, down from 360 GB BF16 (~2.7x). quant_method "modelopt", quant_algo
#   NVFP4 (NOT MIXED_PRECISION, NOT compressed-tensors), so the loader must be
#   told `quantization: modelopt_fp4` explicitly.
#   The quant is deliberately NARROW: only the routed experts of the 48 MoE
#   layers are FP4 (fused gate_up_proj / down_proj, 294,912 tensors, W4A4 E2M1,
#   group 16, FP8 E4M3 block scales, dynamic activations). The ignore list
#   keeps attention, QSA, the GDN linear_attn, the mHC hyperconnections, shared
#   experts, routers, embeddings, lm_head, the vision tower AND all 31 MTP
#   tensors in BF16, byte-identical to the source (the card ships an
#   unchanged-content byte-equality audit over 1,562 tensors / 118.4 GB). The
#   PLE n-gram tables come from the FP8 revision of the base (128 shards
#   F8_E4M3 + a per-table scalar scale). NO KV-cache quant metadata is baked
#   in, which matters (see kv_cache_dtype).
#   Card evals on this exact checkpoint: GSM8K 97.27 (full 1319, 0 errors),
#   AIME26 98.75 pass@1. Card note: long agentic generations run longer than
#   BF16.
#
# ARCHITECTURE (config.json, 2026-08-27)
#   Qwen4ExpForConditionalGeneration, the preview of the Qwen4 architecture.
#   176B total / 6B active, of which 51B is the n-gram embedding table.
#   Multimodal (text + image + video in, text out), 27-layer vision tower.
#   48 decoder layers, full_attention_interval 4, so layer_types is
#   36x linear_attention (Gated DeltaNet: 48 V heads / 16 QK heads, head_dim
#   128) + 12x full_attention running Qwen Sparse Attention (24 Q / 2 KV heads,
#   head_dim 256, partial_rotary_factor 0.25, mrope sections [11,11,10],
#   rope_theta 1e7). QSA indexer: MQA, 4 query heads / 1 shared key head,
#   indexer_head_dim 128, indexer_budget 2048 tokens, indexer_compress_ratio 4
#   (block level, not token level: this is what pins page_size, what caps the
#   draft depth, and what defines the "sparse-selection boundary" above).
#   MoE: 512 experts, top-10 routed + 1 shared, moe_intermediate_size 640.
#   Gated Residual: hc_count 4 branches, hc_lowrank 320.
#   PLE: ngram_size 3, ngram_vocab_size_base 20,000,000 at layer 2,
#   ple_embed_dim 2560, split_ngram_parts 128, ple_embedding_dtype fp8_e4m3.
#   MTP: 1 layer, hybrid, its own full-attention layer is QSA as well.
#   max_position_embeddings 262144 (card: extensible to 1M via YaRN).
#
# SIZING: TP=4 IS MANDATORY, TP=1 IS IMPOSSIBLE
#   135.3 GB checkpoint = 51.2 GB PLE (fp8) + 84.1 GB everything else. That is
#   125.9 GiB of safetensors against a Spark's ~121.7 GiB usable unified pool,
#   so the weights alone do NOT fit one node, full stop. `--ple-offload-
#   embedding` does not rescue a single node either: on unified memory the
#   pinned host allocation draws from the same pool.
#   Across ranks it is fine, and this is measured, not inferred: the upstream
#   long-context runs above were 2x Spark at TP=2 with real weights. The PLE
#   table is a VocabParallelEmbedding (shard_indices.org_vocab_start/end_index
#   in qwen4_exp.py), so it TP-shards like everything else. At TP=4 that is
#   ~12.8 GB/rank PLE plus ~21 GB/rank for the experts and attention, roughly
#   34 GB/rank against 128 GB. KV is cheap on top: only 12 of 48 layers hold a
#   KV cache (2 KV heads x 256 head_dim) and QSA attends a 2048-token window.
#   The real long-context pressure is elsewhere, see chunked_prefill_size.
#
# FLAGS THE UPSTREAM RECIPES USE THAT THIS REPO CANNOT EMIT
#   Documented so the first-contact log is read with the right expectations,
#   NOT as silent omissions:
#     * --linear-attn-prefill-backend / --linear-attn-decode-backend. Every
#       cookbook NVFP4 cell pins both to flashinfer. We have no knob, so
#       linear_attn_backend stays its default "triton" for both phases. That is
#       functionally fine and is in fact REQUIRED for extra_buffer
#       (supports_mamba_cache_extra_buffer() only returns true while
#       linear_attn_backend == "triton"), but expect slower prefill than the
#       published numbers.
#     * --mamba-ssm-dtype bfloat16. Every cookbook cell pins it; the config
#       ships float32. Upstream PRs #36611 / #36627 push the other way
#       (float32 SSM state for the H200 speculative cells), so this is still
#       moving. Without a knob the config value (float32) applies: more
#       scratch, and the safer side of that argument.
#     * --ple-offload-embedding. Auto-enabled by _qwen4_exp_overrides when
#       is_cuda() and the model dtype is bfloat16, which is true here even
#       though the experts are FP4. On GB10 it buys nothing (same pool) and
#       costs a gather hop. If the first profile shows a PLE prefetch stall,
#       adding a --no-ple-offload-embedding knob is the lever.
#     * --mamba-track-interval. Default 256 already satisfies both asserts
#       (256 % page_size 64 == 0, 256 >= speculative_num_draft_tokens 4).
#     * --reasoning-parser auto. We pin the resolved name instead (qwen3).
#
# RISKS, ordered by how likely they are to bite
#   A. THE CORRUPTION ABOVE. p65's veto is the guard and the verify gate is the
#      check that it is live. Re-check both on every image bump.
#   B. p65 edit 2 is validated for BOOT on GB10, not for long-context OUTPUT.
#      The clean 120k-240k column above was produced with a DIFFERENT varlen
#      fallback (a Triton one from MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-
#      Sparks), not with sglang.kernels.ops.attention.flash_attention_v4 which
#      p65 routes to. The evidence supports the direction, not that exact
#      kernel. This is the single biggest unknown in this profile.
#   C. TOOL CALLING. Thinking is ON BY DEFAULT (not unconditional: the chat
#      template carries the standard Qwen3 `enable_thinking` toggle, default
#      true; chat_template_kwargs.enable_thinking=false renders an empty
#      <think></think> block. Verified against the checkpoint's own
#      chat_template.jinja, 2026-08-28).
#      Upstream #36537 reported thinking + >=1 tool + `--tool-call-parser
#      qwen3_coder` emitting token ID 0 forever. #36806 (merged 2026-08-28,
#      closes #36537) showed the token IDs are already zero BEFORE the parser:
#      the cause is the QSA sparse-decode varlen fallback, not qwen3_coder. On
#      SM121 that fallback is still taken, and p65 repairs exactly that
#      fallback (routes it to SGLang's FA4 dispatcher, the same one-function
#      fix the #36537 reporter verified at 0/42 corrupt on SM120).
#      2026-09-16: without a parser the model emitted a correct native
#      <tool_call><function=...> block in plain content (thinking on and off),
#      but message.tool_calls stayed null, so no client saw a tool call.
#      tool_call_parser is therefore set to qwen3_coder below.
#   D. MoE runner on a 640-wide gated MoE. moe_runner_backend below is the
#      cluster's SM121 NVFP4 default, NOT something the cookbook states (its
#      NVFP4 cells pin no MoE runner). If the boot dies on the NVFP4 gated-MoE
#      "intermediate size required padding" assert, flashinfer_trtllm is the
#      known escape on this cluster; triton and cutlass hit the same assert.
#   E. Vision path unvalidated. The tower is BF16 and untouched by the quant,
#      but no QSA + vision run exists on SM121. Treat images as unsupported
#      until measured. (Related, and in our favour: the checkpoint registers as
#      multimodal, so SGLang auto-disables prefill CUDA graphs, which sidesteps
#      a known host-sync crash in the QSA indexer prefill path.)
#   F. Draft depth is capped by the architecture, not by taste:
#      QwenSparseAttnBackend raises when speculative_num_draft_tokens exceeds
#      the QSA compress ratio (4). Do not raise the 4 below.
#   G. Throughput expectation, from the #36558 author's GB10 run with an
#      interim decode kernel (llama-benchy pp2048/tg128, TP=2): 24.6 tok/s
#      single-stream without speculation, 37.6 with NEXTN 3/1/4, 49.2 at
#      concurrency 2, flat in context depth to 16384. That run profiled GB10
#      decode as memory-bandwidth bound (52% of GPU time in cuBLAS bf16 gemv on
#      the non-expert weights), so a faster QSA kernel did not move
#      single-stream throughput at all. The kernel work buys the ability to
#      run, not speed.
_model_profile:
  "RadixArk/Qwen3.8-Flash-Next-NVFP4":
    knowledge_cutoff: null  # not disclosed for the Qwen3.8-Flash-Next base
    release_date: "2026-08-24"  # Qwen/Qwen3.8-Flash-Next base (HF createdAt). This NVFP4 export 2026-08-25.
    info_url: "https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4"
    # The STANDARD 0.5.18-sm121 tag, not a variant: its recipe now sets
    # APPLY_QWEN4EXP_PR36497=1, so the architecture is in the normal image.
    # The tag is on Docker Hub since 2026-08-28. Pinned rather than inherited
    # from default_sglang_image on purpose: 0.5.17-sm121 and everything older
    # have no qwen4_exp at all, and neither does the current default
    # 0.5.19-sm121 (patch no longer applies, see STATUS), so inheriting the
    # default would point this profile at an image that cannot load the
    # checkpoint.
    # Gate with:
    #   EXPECT_QWEN4EXP=1 scripts/verify_sglang_image.sh \
    #       xomoxcc/dgx-spark-sglang:0.5.18-sm121 spark5
    sglang_image: "xomoxcc/dgx-spark-sglang:0.5.18-sm121"
    nccl_transport: "roce"
    # TP=4 with the #36845 SM121 QSA kernel widened to the TP4 shape (6 q, 1
    # replicated kv) by p66, a local deviation from upstream that was validated
    # empirically: 0/32 collapsed, ~35 tok/s (see STATUS). NEXTN stays off.
    # Fallback: nodes [1, 2], tp_size 2, ep_size 1. Plain TP4 on p65's FA4
    # fallback (p66 absent or gated off) collapsed 6/16, never go back to that.
    nodes: [1, 2, 3, 4]
    tp_size: 4
    # EP=4 is REQUIRED at TP=4: moe_intermediate_size 640 / 4 = 160 per rank,
    # 2x160 = 320 is not 128-aligned -> NVFP4 gated-MoE padding assert. EP keeps
    # the full 640 per rank (2x640 = 1280 = 10x128). At TP=2, EP=1 is fine.
    ep_size: 4
    num_experts: 512
    enable_eplb: false
    enable_expert_distribution_metrics: false
    # 262144 native, no YaRN override. The card claims extensibility to 1M via
    # json_model_override_args; do not touch that before a clean boot exists.
    context_length: 262144
    # modelopt NVFP4, stated explicitly. NOT modelopt_mixed (that is the nvidia
    # MIXED_PRECISION uploads) and NOT compressed-tensors. First line to check
    # in the boot log.
    quantization: "modelopt_fp4"
    trust_remote_code: true
    # MANDATORY "auto" (BF16 KV). fp8_e4m3 asserts inside the QSA FA4 decode
    # call during warmup (upstream #36545): q stays bfloat16 while k/v become
    # float8_e4m3fn and the kernel requires all three to match. The checkpoint
    # also bakes no KV scales, so there is nothing to inherit. See risk C.
    kv_cache_dtype: "auto"
    # Largely inert for this model: the 12 full-attention layers run QSA, which
    # calls flash_attn directly and ignores --attention-backend (that is why
    # `triton` does not work around #36558 either). flashinfer is the cluster's
    # NVFP4 default and keeps the flag consistent with fp4_gemm_backend.
    attention_backend: "flashinfer"
    fp4_gemm_backend: "flashinfer_cutlass"
    # SM121 NVFP4 cluster default. NOT taken from the cookbook, which pins no
    # MoE runner on its NVFP4 cells. See risk D for the flashinfer_trtllm
    # escape if the 640-wide gated MoE hits the padding assert.
    moe_runner_backend: "flashinfer_cutlass"
    # NVFP4 scale_fmt is not ue8m0, so the DeepGemm JIT kernels are not
    # optimized for it. Standard for every NVFP4 profile here.
    disable_deep_gemm: true
    # POST-WEIGHT KV reserve, not a fraction of total. ~70 GB/rank of weights at
    # TP=2 (~40 GB measured at TP=4) against 128 GB unified leaves room, but do not read that as licence to
    # raise this: the upstream 2x-Spark runs used 0.90 and had to drop to 0.82
    # to stay clean at 240k, because the QSA indexer prefill workspace (see
    # chunked_prefill_size) competes for exactly this headroom. 0.70 is the
    # conservative first-contact value at TP=4. On this hybrid the mamba pool
    # usually clamps concurrency before KV does, so if max_running_requests
    # gets clamped low, raise max_mamba_cache_size rather than this.
    # 2026-09-16 TP=2: 0.60 crash-looped right after weight load with
    # "Not enough GPU memory for hybrid (mamba/linear-attention) state cache"
    # (total_rest_memory=-9.39 GB; weights 75.2 GB + MTP 0.8 GB per rank). 0.82
    # is the value the upstream 2x-Spark TP=2 runs settled on (see above).
    mem_fraction_static: "0.82"
    # Pinned to 64 to match what SGLang itself forces. _qwen4_exp_overrides
    # sets page_size 64 UNCONDITIONALLY for the compressed QSA variant: the
    # compressed cache is addressed as full_slot // compress_ratio (the DSV4
    # scheme), so the full-KV allocation has to be page-aligned with the page
    # a multiple of the compress ratio (4). Stating it here keeps the launch
    # command honest and keeps the mamba_track_interval % page_size assert
    # visible.
    page_size: 64
    # The value the model card, the SM120 repro (#36531) and the upstream
    # long-context runs all use. It is ALSO a memory knob at depth, which is
    # easy to miss: the QSA indexer allocates an fp32 [chunk x history]
    # workspace per sparse layer per chunk, roughly 8-10 GB at chunk 4096 with
    # 240k of history. The upstream 2x-Spark run corrupted 2/6 at 240k with
    # chunk 4096 / mem_fraction 0.90 purely from that, and went 6/6 clean at
    # chunk 1024 / 0.82. So if long-context output degrades, drop this to 1024
    # BEFORE concluding the decode kernel is at fault (risk A vs a resource
    # failure look identical in the output).
    chunked_prefill_size: 4096
    # First-contact concurrency cap, deliberately below the card's 36: that
    # number is a single-B200 measurement and GB10 decode is bandwidth bound
    # here. Raise once a clean boot and a mamba-pool headroom reading exist.
    max_running_requests: 16
    cuda_graph_max_bs: 32
    # Thinking is ON BY DEFAULT, so the reasoning parser is not optional. (It
    # is not unconditional: enable_thinking=false per request renders an empty
    # <think></think> block. See risk C.)
    # `--reasoning-parser auto` resolves to qwen3 for this checkpoint. Two
    # independent confirmations: the #36537 server log says so, and running
    # v0.5.18's own srt/parser/template_detection.py against the checkpoint's
    # chat_template.jinja gives reasoning_config=(enable_thinking, default
    # true) -> rule enable_thinking_default_true -> _is_qwen3 -> "qwen3"
    # (2026-08-28). Pinned rather than left on auto so a change to upstream's
    # detection rules cannot silently swap the parser under us.
    #
    # THIS TEMPLATE ALSO READS reasoning_effort, and its accepted set is NOT the
    # OpenAI one (verified against the checkpoint's own chat_template.jinja on
    # the cluster, 2026-08-28):
    #     {%- set resolved_reasoning_effort = reasoning_effort|default('xhigh') %}
    #     {%- if resolved_reasoning_effort not in ('xhigh','medium','low') %}
    #         {{- raise_exception('Unexpected reasoning effort ...') }}
    # So xhigh (the DEFAULT, i.e. thinking is not merely on, it is on at max) /
    # medium / low are the only legal levels, and the obvious-looking
    # `--reasoning-effort high` (or max, or minimal) is a chat-template
    # exception, i.e. HTTP 400 on EVERY request. Thinking is turned OFF with
    # enable_thinking=false, never with a level.
    # 'none' is the one exception that does NOT raise: SGLang derives
    # chat_template_kwargs.enable_thinking=false from it
    # (v0.5.18 protocol.py normalize_reasoning_inputs), so this template skips
    # its effort check entirely. It is still not in reasoning_efforts below,
    # because --no-think is the direct way to say that.
    # xhigh IS inside SGLang's own request schema
    # (ReasoningEffortTier = none/minimal/low/medium/high/xhigh/max in v0.5.18),
    # so it travels as the normal top-level field and needs no
    # chat_template_kwargs smuggling.
    reasoning_parser: "qwen3"
    # Values this model's OWN chat template accepts for reasoning_effort,
    # read from the checkpoint on the cluster 2026-08-28. SGLang's request
    # schema (ReasoningEffortType) is WIDER than this and family-agnostic,
    # so a value can pass pydantic and still hit a raise_exception() in the
    # template = HTTP 400 on every request. sglang-test checks
    # --reasoning-effort against this list before sending anything.
    # chat_template.jinja: reasoning_effort|default('xhigh'), then
    # raise_exception() unless it is in ('xhigh','medium','low'). 'xhigh' is
    # also the DEFAULT, so an unset level means maximum thinking, and 'high' /
    # 'max' / 'minimal' are an HTTP 400 here despite being legal in SGLang's
    # own schema. Thinking is turned OFF with enable_thinking=false
    # (sglang-test --no-think), never with a level.
    reasoning_efforts: ["xhigh", "medium", "low"]
    # qwen3_coder is also what SGLang's template auto-detection resolves for
    # this checkpoint. Set on 2026-09-16 after #36806 moved the #36537 token-0
    # loop out of the parser (see risk C).
    tool_call_parser: "qwen3_coder"
    # From the checkpoint's generation_config.json (do_sample true). The
    # cookbook notes Qwen published no sampling recommendation for this
    # preview and suggests leaving it to the checkpoint, which is what these
    # values are.
    recommended_sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
    # MTP / NEXTN speculative decoding, matching the cookbook's low-latency
    # NVFP4 cells exactly (NEXTN 3/1/4), the config that #36558 measured on
    # GB10 (24.6 -> 37.6 tok/s single-stream once decode had a kernel), and the
    # config the upstream 2x-Spark long-context A/B ran with, so the clean
    # 6/6 column in the header was produced WITH speculation on.
    # The MTP head is present and BF16 in this checkpoint (31 tensors, in the
    # modelopt ignore list as mtp.* / model.mtp.*), so no external draft repo
    # and no speculative_draft_model_path are needed.
    # speculative_num_draft_tokens 4 is a HARD CEILING, not a tuning choice:
    # QwenSparseAttnBackend raises when it exceeds indexer_compress_ratio (4).
    # speculative_draft_model_quantization is left unset on purpose: for an
    # in-checkpoint MTP head "unquant" is a no-op (quant auto-detection re-reads
    # the same config), and here the ignore list already keeps the head BF16.
    # 2026-09-16: OFF. With NEXTN on, 3/16 (TP4) and 4/16 (TP2 + #36845 kernel)
    # short generations collapsed into "!" (token 0); with it off, 0/16 at TP2.
    # See STATUS at the top before turning this back on.
    speculative_enabled: false
    speculative_algo: NEXTN
    speculative_num_steps: 3
    speculative_eagle_topk: 1
    speculative_num_draft_tokens: 4
    # MANDATORY, not an optimisation. page_size is forced to 64 (above) and
    # MambaRadixCache only supports page_size > 1 under the extra-buffer
    # strategy, so without this the QSA pool fails fast at boot (the only
    # alternative would be --disable-radix-cache). Qwen4ExpForConditionalGener
    # ation is in _MAMBA_EXTRA_BUFFER_ARCHS, and the second condition,
    # linear_attn_backend == "triton", holds because this repo never overrides
    # it. Emitted as the current --mamba-radix-cache-strategy spelling.
    mamba_scheduler_strategy: "extra_buffer"
    # enable_spec_v2 deliberately NOT set: SGLANG_ENABLE_SPEC_V2 was removed in
    # 0.5.17 (speculative decoding always runs the V2 worker) and would only
    # add a deprecation line to the log.
    #
    # ROLLBACK to bare serving: speculative_enabled: false. Every other key
    # stays valid; the speculative_* keys go inert. mamba_scheduler_strategy
    # must STAY extra_buffer either way, because page_size 64 requires it.
