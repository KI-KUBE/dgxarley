# Model profile: vroomfondel/GLM-5.3-Flash-NVFP4-W4A4
# Loaded by include_vars in k8s_dgx role, merged into sglang_model_profiles.
#
# ── STATUS (2026-10-08): SERVES ON TP4 WITH MTP (EAGLE 5/1/6), p42+p68+p69+p70, TILELANG + BF16 KV ──
# Our own surgical NVFP4 W4A4 top-up (quantizer/surgical_glm5next_nvfp4.py)
# of LibertAIDAI/GLM-5.3-Flash-NVFP4, which is a ModelOpt experts-only NVFP4 export
# of zai-org/GLM-5.3-Flash. The card says it plainly: no token has ever been
# generated from this checkpoint. The chosen attention route is the upstream
# cookbook NVFP4 recipe (dsa tilelang prefill+decode, bf16 KV) plus runtime patch
# p68_dsa_tilelang_sm121_tile.py. First end-to-end boot 2026-10-08 (TP4, image
# 0.5.21-sm121): loader crash (item 5, fixed by p70), then weights 447 s, KV pool
# 1673728 tokens bf16 (19.8 GB/rank), KDA on TritonKDAKernel, "fired up" after ~10 min,
# coherent German chat completion with reasoning, single-request decode 23-32 tok/s
# (cuda graph on, no spec). Open items:
#
#   1. IMAGE (resolved). The default image is xomoxcc/dgx-spark-sglang:0.5.21-sm121
#      (default_sglang_image in roles/k8s_dgx/defaults/main/sglang.yml); v0.5.21
#      contains srt/models/glm5_next.py (#36507, #38621), so it carries the
#      architecture and this profile needs no image override.
#
#   2. DSA ATTENTION (route chosen, unbooted). GLM-5.3-Flash uses DSA with
#      index_kpool=4 (compressed indexer keys). upstream dsa_backend_kpool.py
#      raises NotImplementedError unless the DSA prefill/decode impl is one of
#      fa3 / tilelang / trtllm ("index_kpool > 1 appends tail tokens to
#      topk_indices"). On SM121 fa3 is gated to SM8x/9x and trtllm is trtllm-gen
#      FMHA (ISA wall). tilelang: the v1 kernel (tail_dim==0, GLM-5.3-Flash) was
#      VERIFIED 2026-10-08 on spark5 to launch and match a float32 reference with a
#      retuned tile block_I=32/num_stages=1/threads=128 (kernel level only,
#      DSA_speedup.md; the stock tile fails launch on smem; the v2 kernel used by
#      GLM-5.2 stays dead). p68 injects that tile on SM12x (gated on
#      SGLANG_DSA_DECODE_BACKEND/SGLANG_DSA_PREFILL_BACKEND == tilelang). The KPool
#      glue is fine: _forward_tilelang (dsa_backend.py:3056-3085) pads the 2051-wide
#      kpool topk to 2112, prefill and decode share the kernel, no arch gate.
#      TileLang DSA rejects fp8 KV (cookbook: "not a valid CUDA combination"), hence
#      bf16 KV. Retired alternative: p34 (trtllm on SM12x + fp8 KV -> flashinfer
#      native SM120/121 sparse MLA), which would need a KPool re-anchor.
#
#   3. INDEXER (resolved two ways, unbooted). GLM-5.3-Flash uses the separate class
#      IndexerKPool (dsa_indexer_kpool.py, chosen in models/deepseek_v2.py:2070),
#      which calls deep_gemm.fp8_paged_mqa_logits (decode) and
#      deep_gemm.fp8_mqa_logits (ragged prefill) DIRECTLY, not via the
#      paged_mqa_logits_backend dispatch, so p30/p35 never reached it. GPU-verified
#      2026-10-08 on spark5 (image 0.5.21-sm121): BOTH DeepGEMM calls run on SM121
#      and match a float32 reference, so `auto` would work. p69 adds the torch/triton
#      arm (paged decode/verify only, p30 semantics, -inf masks + CUDA graph replay
#      verified at function level); ragged prefill stays on DeepGEMM.
#
#   5. WEIGHT LOAD (first boot 2026-10-08, crash, fixed by p70). The export keeps
#      ONLY the MTP layer's q_b_proj BF16 (ignore entry
#      model.language_model.layers.45.self_attn.q_b_proj); layers 0-44 ship it NVFP4.
#      Stock ModelOptQuantConfig.is_layer_excluded compares such q_a/q_b/kv_a/kv_b
#      entries by tail only and drops the layer index, so q_b_proj was built BF16 in
#      every layer: `param_data.shape=[4096, 1536] != loaded_weight.shape=[4096, 768]`
#      at shard 7 (layer 11). p70_modelopt_exclude_fused_layer_scope.py scopes the
#      fused-tail match to the entry's module path (spark5-verified, stock-equal
#      elsewhere). Needs a patch-ConfigMap roll to take effect.
#
#   4. KDA / mHC (unverified on SM121). KDA layers use the Triton KDA kernel
#      (NvidiaKDAKernel is major==10 only, no SM12x gate found, untested on GB10).
#      mHC uses TileLang kernels by default (SGLANG_OPT_USE_TILELANG_MHC_PRE/POST,
#      torch fallback when 0) plus deep_gemm.tf32_hc_prenorm_gemm while
#      SGLANG_OPT_DEEPGEMM_HC_PRENORM=1 (default); torch fallbacks exist via those
#      env vars.
#
#   6. MTP / EAGLE (BOOTED 2026-10-08 on the second attempt, image 0.5.21-sm121): draft
#      load 97 s (1.94 GB/rank), mamba cache 221 slots (ssm 7.59 GB + intermediate_ssm
#      6.77 GB), KV 1660992 tokens, target_verify graphs 31 s, draft decode/extend graphs
#      10 s / 2 s, 11.9 GB free after capture, fired up after ~13 min. Single request:
#      accept len 2.3 to 3.95, decode 28 to 42 tok/s (vs 23 to 32 without spec). GSM8K
#      15 min conc 8 (TESTLOGS/sglang_nn4_tp4_ep1/glm-5.3-flash-nvfp4-w4a4): spec off
#      98.7% / 112.8 tok/s peak, spec on 96.8% / 140.3 tok/s peak, accept len median 4.14.
#      Full test split (1319, spec on): 96.6% scored (3 truncated at 8192), 111.6 tok/s
#      aggregate, 164 tok/s peak, accept len median 4.18, 0 restarts. Concurrency sweep
#      (2n questions, peak tok/s): n1 50, n2 71, n4 122, n8 133, n16 172, n32 210; aggregate
#      saturates around n16 (137 tok/s), accept len ~4.0 at every level.
#      Draft = Glm5NextForConditionalGenerationNextN (models/glm5_next_nextn.py, picked
#      by model_config.py:899-906 for is_draft_model), a DeepseekV3ForCausalLMNextN
#      subclass: pure MLA/DSA layer 45 (linear_attn_config forced None), IndexerKPool,
#      KDA only on the target. Needs: (a) speculative_draft_model_path set explicitly,
#      speculative_hook.py:1007-1043 auto-derives it only for DeepseekV3/GlmMoeDsa/...,
#      not for Glm5Next; (b) patch p42_dsnextn_mixed_mtp.py (gated on spec enabled),
#      because deepseek_nextn.py:73-77 nulls quant_config for every modelopt_fp4 target
#      and layer 45 keeps its ROUTED EXPERTS NVFP4, so without it the draft MoE is built
#      BF16 and the load crashes. p42's July alias scan looked for `.layers.45.` excludes,
#      but on 0.5.21 the Glm5Next NextN mapper has already rewritten them to
#      `model.decoder.*` before __init__ (loader.py applies the mapper to quant_config
#      first), so the first MTP boot 2026-10-08 fell back to the blanket null; p42 now
#      also accepts the mapped form. (c) p70 for the layer-scoped q_b_proj entry. Draft
#      exclusion decisions verified with p70+p42 on spark5 (/root/p42_test/run.log):
#      shared_experts / o_proj / q_b_proj / low-rank / indexer / router BF16, routed
#      experts NVFP4. Shared-expert fusion is off in the draft (n_routed_experts 288 is
#      not in the fusion allow-list, deepseek_v2.py:3287). enable_spec_v2 is a no-op on
#      0.5.21 (spec v2 is the only EAGLE path), speculative_draft_model_quantization
#      must stay unset (unquant would build BF16 experts), the draft MoE runner follows
#      the target (overrides.py:1560). First fallbacks: steps 3 / draft tokens 4, then
#      speculative_enabled false. Watch the KDA intermediate_ssm scratch size in the
#      mamba pool log against the 13 GB headroom.
#
# The backend values below are the cookbook route plus p68; they are a plan, not a
# measured config.
#
# ── ARCHITECTURE (verified against config.json 2026-09-16) ─────────────────────
# Glm5NextForConditionalGeneration, model_type glm5_next (text: glm5_next_text,
# vision: glm5_next_vision). Hybrid, 45 layers:
#   - 34 KDA linear-attention layers (Kimi Delta Attention, 64 heads, head_dim 128,
#     short conv 4) + 11 MLA/DSA full-attention layers (3,7,...,43; kv_lora_rank
#     512, q_lora_rank 1536, qk_nope_head_dim 256, NO rope dims). KDA state goes
#     through the MambaPool machinery (constant per request) → KV only grows on the
#     11 MLA layers, so long context is cheap.
#   - DSA indexer: 32 heads, index_head_dim 128, topk 2048, index_kpool 4.
#   - mHC hyper-connections (hc_mult 4, sinkhorn 20 iters).
#   - MoE: 288 routed experts, 8 active + 1 shared, sigmoid noaux_tc routing,
#     routed_scaling_factor 2.5, swiglu_limit 10.0; layers 0-2 dense
#     (intermediate 12288), expert intermediate 2048. hidden 4096, vocab 154880.
#   - MTP: num_nextn_predict_layers=1, sits INSIDE the layer numbering as layer 45
#     (kept BF16, incl. its shared experts / o_proj / q_b_proj in the ignore list).
#   - Vision: 24-layer tower, patch 14, image 448 (kept BF16).
#   - max_position_embeddings 1048576 (1M).
#
# ── QUANT (verified against config.json + README) ───────────────────────────────
# modelopt 0.45.0, quant_algo NVFP4, group 16, W4A4 (the "input_activations": null
# in config.json is inherited and misleading; input_scale tensors select W4A4).
# FP4: routed experts (from the base export, byte-identical) + NEW: o_proj on all
# 45 layers, q_b_proj on the 11 MLA layers, shared experts 3-44, dense MLP 0-2.
# BF16: KDA state path, MLA low-rank compressions, DSA indexer, routers, mHC, MTP
# layer 45, vision, lm_head, embed_tokens. The newly quantized input_scale values
# are a data-free HEURISTIC (generous amax), not calibrated → a GSM8K gate against
# LibertAIDAI/GLM-5.3-Flash-NVFP4 is mandatory before trusting output quality.
# 176.4 GiB safetensors → ~44 GiB/GPU at TP=4. Upstream #38621 disables shared-
# expert fusion only when shared experts are BF16 but routed are FP4; here both
# are FP4, so fusion stays on (the "uniform-FP4" case its tests cover).
_model_profile:
  "vroomfondel/GLM-5.3-Flash-NVFP4-W4A4":
    knowledge_cutoff: null  # not disclosed on the zai-org/GLM-5.3-Flash card
    release_date: "2026-08-25"  # zai-org/GLM-5.3-Flash base (HF createdAt). This W4A4 top-up 2026-09-04.
    info_url: "https://huggingface.co/vroomfondel/GLM-5.3-Flash-NVFP4-W4A4"
    # ALTERNATIVE (experts-only base, calibrated scales): https://huggingface.co/LibertAIDAI/GLM-5.3-Flash-NVFP4
    # ALTERNATIVE (upstream-cookbook NVFP4 W4A4): https://huggingface.co/RadixArk/GLM-5.3-Flash-NVFP4
    nccl_transport: "roce"
    # 64 attention heads, 64 KV heads, 64 KDA heads, 32 indexer heads → TP=4 divides
    # all of them. Cookbook runs TP=4 on GB300/GB200.
    tp_size: 4
    # Conservative first contact. KV only grows on 11 MLA layers (512-dim latent,
    # bf16 → ~11 KB/token for all 11 layers, plus kpool-compressed indexer keys), so
    # 262K is cheap memory-wise; raise toward the 1M native window once it serves.
    context_length: 262144
    quantization: "modelopt_fp4"
    # The repo ships NO custom modeling/config .py (no auto_map); SGLang has native
    # glm5_next config + model code, so remote code is never needed.
    trust_remote_code: false
    # KPool DSA asserts page_size == 64 (dsa_backend.py: "kpool path requires
    # page_size == 64 and page_size % pool_size == 0"). page_size > 1 also lets the
    # mamba radix cache auto-resolve to extra_buffer (linear_attn_backend triton).
    page_size: 64
    moe_runner_backend: "flashinfer_cutlass"  # cookbook NVFP4 recipe + our SM121 NVFP4 MoE path
    fp4_gemm_backend: "flashinfer_cutlass"
    # tilelang DSA rejects fp8 KV; fp8 KV was only the p34 prerequisite.
    kv_cache_dtype: "bfloat16"
    mem_fraction_static: "0.80"
    # p68 retunes the tilelang tile on SM12x (v1 kernel only).
    attention_backend: "dsa"
    dsa_decode_backend: "tilelang"
    dsa_prefill_backend: "tilelang"
    # IndexerKPool reaches these only via p69 (paged path); ragged prefill stays on DeepGEMM.
    dsa_paged_mqa_logits_backend: "torch"
    dsa_indexer_triton: true
    jit_max_jobs: 4
    disable_piecewise_cuda_graph: true
    disable_cuda_graph: false
    cuda_graph_max_bs: 32  # cookbook: --cuda-graph-max-bs-decode 32
    pp_async_batch_depth: 0
    disable_deep_gemm: true  # NVFP4 (scale_fmt != ue8m0); see the GLM-5.2 profiles
    # Cookbook parsers. #38297 auto-detects GLM-5.3 templates as glm45/glm47 and
    # #39227 forces reasoning mode. A dedicated glm53 tool-call detector (#37925) is
    # still OPEN; re-check on the image bump.
    reasoning_parser: "glm45"
    tool_call_parser: "glm47"
    num_experts: 288
    ep_size: 1
    recommended_sampling:
      temperature: 1.0  # generation_config.json
      top_p: 0.95       # generation_config.json
    # MTP head (layer 45): routed experts NVFP4, rest BF16; needs p70 + p42 (header item 6).
    # Cookbook low-latency recipe: EAGLE steps 5 / topk 1 / draft tokens 6 (= steps + 1).
    speculative_enabled: true
    speculative_algo: "EAGLE"
    speculative_num_steps: 5
    speculative_eagle_topk: 1
    speculative_num_draft_tokens: 6
    # Not auto-derived for Glm5NextForConditionalGeneration; same checkpoint as the target.
    speculative_draft_model_path: "vroomfondel/GLM-5.3-Flash-NVFP4-W4A4"
