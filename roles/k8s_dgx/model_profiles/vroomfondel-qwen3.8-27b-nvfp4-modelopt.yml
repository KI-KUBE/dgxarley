---
# Model profile: vroomfondel/Qwen3.8-27B-NVFP4-ModelOpt
# Loaded by include_vars in k8s_dgx role, merged into sglang_model_profiles.
#
# STATUS 2026-08-15 (UPDATED, same day): the DSPARK path below is now MEASURED,
#   end to end, on a single Spark (GB10/sm121, SGLang 0.5.17) via the
#   quantizer's serve path -- NOT yet through this Ansible role, which remains
#   the one unvalidated hop.
#     * drafter RadixArk/Qwen3.8-27B-DSpark loads in 18.5 s (2.95 GB), reports
#       gamma=7, verify_num_draft_tokens=8, markov_head=VanillaMarkov, and draft
#       CUDA-graph capture (prefill+decode+verify) completes.
#     * full GSM8K, all 1319 items, 5-shot, chat endpoint, max_tokens 16384,
#       temperature 0.6, concurrency 16:  97.42% (1285/1319), strict == flexible
#       exactly, ZERO errors and ZERO empty responses. 65.4 min.
#     * speculation health: mean accept len 3.77 of a ceiling of 8, accept rate
#       0.38-0.42 over 415 decode batches, ~186 tok/s aggregate at 11-13
#       concurrent (~15 tok/s per stream). The value scattering around half the
#       ceiling is the GOOD case; an accept len pinned AT 8 would have meant the
#       verify stage stopped rejecting, i.e. silent corruption.
#     * no same-settings run WITHOUT speculation was measured, so no speedup
#       factor is claimed. (Superseded by the 2026-10-10 sweep below.)
#
# STATUS 2026-10-10: SPECULATIVE SWEEP on a single Spark (spark5, GB10, TP=1,
#   SGLang 0.5.21-sm121, scripts/run_standalone.sh PRESET=qwen38_27b), GSM8K
#   chat API, temperature 0, levels n=1/4/8/16. Full matrix in
#   TESTLOGS/standalone_nn1_tp1/qwen-3.8-27b-nvfp4-modelopt/TESTLOG_nv580.178.04_sglang-0.5.21-sm121_qwen-3.8-27b-nvfp4-modelopt_1n.md.
#   Peak tok/s n=1 / n=4 / n=8 / n=16, accept len:
#     no speculation            12.6 /  49.4 /  94.2 / 166.3
#     MTP (EAGLE) 3/1/4         24.9 /  94.1 / 159.6 / 255.2   3.10 of 4
#     MTP (EAGLE) 5/1/6         24.7 /  93.5 / 143.3 / 255.7   3.62 of 6
#     DSPARK RadixArk gamma 3   31.5 / 107.2 / 184.1 / 282.7   3.20 of 4
#     DSPARK RadixArk gamma 5   41.3 / 126.4 / 209.0 / 320.6   3.81 of 6
#     DSPARK RadixArk gamma 7   48.3 / 138.8 / 231.7 / 336.9   4.31 of 8  <- THIS PROFILE
#   * Speculation is mandatory here: DSPARK gamma 7 is x3.8 at n=1 and x2.0 at
#     n=16 over no speculation. It beats the best MTP setting by x1.9 / x1.3.
#   * The in-checkpoint MTP head WORKS on 0.5.21 when driven as EAGLE: no crash,
#     healthy accept len, GSM8K identical to no-draft. The 0.5.17 NEXTN
#     fast_prefill_plan crash below did not reproduce. MTP is now a valid but
#     slower fallback (see the ALTERNATIVE block), not a known failure.
#   * GSM8K quality identical in every case (all misses are the same question,
#     also missed without speculation).
#   * RedHatAI/Qwen3.8-27B-speculator.dspark (block 8) is in the same class as
#     the RadixArk draft (n=16 317-346 vs 337) but ships in the vLLM speculators
#     config format SGLang cannot parse; it only ran with a hand-converted
#     config. Not worth switching to.
#   * gamma 7 caps max_running_requests at 15 (mamba state cache with float32
#     SSM state, 5 slots per request); see SM121 review 7 for the KV-scale
#     finding from the same runs.
# 2026-08-15 (0.5.17) NEXTN result, kept for history: NEXTN on the
#   in-checkpoint MTP head killed the scheduler on the first real request with a
#   FlashInfer exception (fast_prefill_plan -> call_begin_forward ->
#   update_single_wrapper -> init_forward_metadata_out_graph); narrowed, not
#   proven (runs differed in context length, crash log lost).
#   Still ungated: the IMAGE path (text-only calibration) and this role's own
#   deploy hop (TP=4).
#
# WHAT THIS CHECKPOINT IS (verified against HF 2026-08-15, repo created the
# same day):
#   vroomfondel's NVIDIA-ModelOpt (0.45.0) export of Qwen/Qwen3.8-27B,
#   `qformat: nvfp4` = UNIFORM W4A4 (E2M1, group 16, FP8 block scales) with FP8
#   KV baked in. hf_quant_config.json: quant_algo NVFP4 (NOT MIXED_PRECISION),
#   kv_cache_quant_algo FP8, exclude_modules = lm_head, embed_tokens,
#   model.visual*, mtp*, and per GDN layer conv1d / in_proj_a / in_proj_b.
#   Everything else is FP4, INCLUDING the full self_attn q/k/v/o on the 16
#   full-attention layers AND the fused Gated-DeltaNet in_proj_qkv on all 48
#   linear-attention layers. 20.6 GB over 3 shards. The 27-layer vision tower
#   stays BF16 (text-only calibration), so the image path is the least
#   validated surface of the build: check it against the BF16 source before
#   relying on it. config.json pins dtype/torch_dtype bfloat16, so `--dtype
#   auto` resolves bf16 (the same detail that kept the Qwen3.6 sibling's
#   unquantized in_proj_ba from loading as fp16 and dying at graph capture).
#
# Architecture (Qwen3_5ForConditionalGeneration, model_type qwen3_5, i.e. the
# DENSE VL member of the Qwen3.5 family, not the MoE one): 27B dense, 64 layers
# with full_attention_interval 4, so layer_types is 48x linear_attention
# (Gated DeltaNet) + 16x full_attention at indices 3, 7, ..., 63. hidden 5120,
# intermediate 17408, 24 query heads / 4 KV heads, head_dim 256,
# attn_output_gate, partial_rotary_factor 0.25, mrope (interleaved, sections
# [11,11,10]), rope_theta 1e7, vocab 248320, max_position_embeddings 262144,
# mtp_num_hidden_layers 1 (a native MTP head, see the NEXTN alternative at the
# bottom). Multimodal: image + video pads via <|vision_start|>.
#
# ── SM121 / GB10 REVIEW (source-verified against v0.5.17, 2026-08-15) ────────
#   1. DSPARK is arch-generic. speculative_hook.py::_handle_dspark has no arch
#      allowlist (unlike deepseek_v4_hook.py, which restricts ITS arch to
#      EAGLE/DSPARK), and the standalone-draft branch is present in v0.5.17
#      ("DSpark dense speculative decoding requires setting
#      --speculative-draft-model-path"). v0.5.16 has DSPARK too but v0.5.17 is
#      what the quantizer smoke-tested the target on, so that is the floor.
#   2. The DSpark kernels are portable. python/sglang/kernels/ops/speculative/
#      dspark/* is pure Triton with a torch reference fallback selected by
#      dispatch.py on device type, no sm90/sm100 gate anywhere. Same story for
#      srt/speculative/dspark_components/.
#   3. The draft attention backend allowlist is (flashinfer, fa3, fa4, triton,
#      trtllm_mha, ascend) with a flashinfer fallback on CUDA, so the draft is
#      fine on GB10. DO NOT copy the model card's `--attention-backend fa3`:
#      FA3 is Hopper-only and would fail here.
#   4. extra_buffer is supported for this arch. Qwen3_5ForConditionalGeneration
#      is in arg_groups/overrides.py::_MAMBA_EXTRA_BUFFER_ARCHS, and
#      supports_mamba_cache_extra_buffer() additionally requires
#      linear_attn_backend == "triton", which is SGLang's default and which
#      this repo has no knob for. Leave it alone.
#   5. Two different "triton" knobs, do not confuse them: linear_attn_backend
#      (the GDN kernel backend, must stay triton, see 4) and attention_backend
#      (the full-attention backend, must be flashinfer here). The quantizer
#      measured a forward-time crash in RadixLinearAttention.forward with
#      attention_backend=triton on exactly this configuration, upstream
#      sgl-project/sglang#29577, still open.
#   6. p50_qwen35_attn_quant + p51_qwen35_kvscale were upstreamed as PR #31220
#      and merged (c4af6cf26397) BEFORE the v0.5.17 cut, so the pinned image
#      already contains them and both patches will log one honest "gate not
#      matched" line at container start. That is expected, not drift. Still
#      required from our patch set: p29_cutlass_mma_sm121 (arch-independent
#      GB10 NVFP4 mma fix, applied for every NVFP4 model).
#   7. Sanity check for the baked KV scales: the boot log must contain "Using
#      FP8 KV cache but no scaling factors provided" ZERO times.
#      OPEN 2026-10-10: on 0.5.21 the TARGET logs it once ("Defaulting to
#      scaling factors of 1.0"), with and without a draft, so the baked scales
#      are not picked up there. GSM8K was unaffected in the sweep; re-check the
#      p51 gate / PR #31220 path on 0.5.21 before trusting long-context output.
#
# ── RISKS, reconciled against the measured run at the top of this file ───────
# RETIRED by the 2026-08-15 measurement:
#   A. "Uniform W4A4 on a Gated-DeltaNet hybrid degrades into word salad rather
#      than into a measurable accuracy drop when a scale on the fused
#      linear_attn.in_proj_qkv loads badly." This was the top risk and it is
#      settled: 97.42% over all 1319 GSM8K items with strict == flexible and
#      zero empty responses is not a build with a broken GDN path. Keep the
#      failure MODE in mind for future re-quants of this arch (judge on
#      generated text, not on a clean boot), but it is no longer an open
#      question for THIS checkpoint.
#   B. "Expect lower acceptance than the card." Confirmed and quantified, and
#      the comparison is easy to get wrong: the card's headline 3.39 is the
#      mean over 11 mixed workloads, its GSM8K cell is 4.57. We measured 3.77
#      on GSM8K, so against the MATCHING workload the W4A4 target does cost
#      acceptance, roughly 0.8 tokens per verify, exactly as predicted from the
#      draft having been trained against the FP8 target. It is not a defect.
#      The regression detector stays the same: `accept len` pinned AT the
#      ceiling (= speculative_num_draft_tokens = 8) means verify stopped
#      rejecting anything, i.e. draft and target read the same wrong data,
#      while throughput and startup look healthy. 3.77 of 8 is the good case.
#
# STILL OPEN, ordered by how likely they are to bite:
#   C. RESOLVED 2026-10-11 (TP=4 cluster sweep, float32 SSM): the profile
#      boots and serves as shipped, no restarts, no eager decode batches,
#      max_running_requests 32 without a mamba-cache cap. DSpark gamma 7 is
#      best or tied at every level, peak n=1/4/8/16/32 93-104 / 293-295 /
#      341-356 / 424-429 / 563-588 (two runs); gamma 5 is 3-10 % behind, MTP
#      falls below no-speculation at n=32. Full matrix in
#      TESTLOGS/sglang_nn4_tp4_ep1/qwen-3.8-27b-nvfp4-modelopt/.
#      4 nodes vs 1 node is x2.1 at n=1/4, but at n>=16 a single Spark with
#      bf16 SSM state (run_standalone.sh defaults) is on par (n=16 437 vs
#      424-429). The n=32 harness peaks overstate both sides (lifetime-averaged
#      rates of the long tail); the engine's own gen throughput at 28-32
#      running requests is ~350 tok/s single node vs ~340-410 on TP=4.
#   D. RE-MEASURED 2026-10-11 on TP=4: DSpark gamma 7 vs no speculation is
#      x2.7 at n=1, x2.3 at n=4, x1.5 at n=8, x1.2 at n=16, ~x1.0 at n=32
#      (single Spark: x3.8 at n=1, x2.0 at n=16). The draft pays for latency,
#      not for throughput at high concurrency on TP=4.
#   E. The image path is calibrated on text only (see above), so the vision
#      surface remains the least validated part of the build.
#   F. RESOLVED on 0.5.21: the in-checkpoint MTP head works as EAGLE (it was a
#      measured NEXTN failure on 0.5.17). Slower than DSpark; see ALTERNATIVE.
_model_profile:
  "vroomfondel/Qwen3.8-27B-NVFP4-ModelOpt":
    knowledge_cutoff: null  # not officially disclosed for the Qwen3.8-27B base
    release_date: "2026-08-05"  # Qwen/Qwen3.8-27B base, HF API createdAt. This NVFP4 export 2026-08-15.
    info_url: "https://huggingface.co/vroomfondel/Qwen3.8-27B-NVFP4-ModelOpt"
    litellm_input_cost_per_token: 0.000000425   # $0.425 per 1M, OpenRouter list price, qwen/qwen3.8-27b (base model), checked 2026-10-10
    litellm_output_cost_per_token: 0.00000255  # $2.55 per 1M, OpenRouter list price, qwen/qwen3.8-27b (base model), checked 2026-10-10
    # SM121 sgl-kernel build required for NVFP4 on GB10. 0.5.17 is the FLOOR:
    # it is the release that carries the merged PR #31220 (quantized attention
    # + baked KV scales for qwen3_5) this checkpoint depends on, and it is the
    # version the target was smoke-tested on.
#    sglang_image: "xomoxcc/dgx-spark-sglang:0.5.18-sm121"
    nccl_transport: roce
    # DSPARK requires pp_size == 1 (_handle_dspark raises otherwise), so TP is
    # the only topology that can also speculate. TP=4 matches the standard
    # head+3-worker deployment of this role. NOTE: at 20.6 GB the checkpoint
    # fits one Spark, so TP=1 as its own sglang_instances entry is a legitimate
    # alternative (that is how the quantizer smoke-tested it) and removes the
    # inter-node hop from every verify step.
    tp_size: 4
    ep_size: 1
    # Native 262K context, no YaRN needed.
    context_length: 262144
    # Uniform-NVFP4 unified ModelOpt checkpoint -> standard modelopt_fp4 loader,
    # NOT modelopt_mixed (that is the nvidia MIXED_PRECISION uploads' path) and
    # NOT compressed-tensors. First thing to confirm in the boot log.
    quantization: "modelopt_fp4"
    trust_remote_code: true
    # FP8 KV baked into the checkpoint, on exactly the 16 full-attention layers.
    kv_cache_dtype: "fp8_e4m3"
    # Inherited from the Qwen3.6 W4A4 sibling. This is the post-weight KV
    # reserve, not a fraction of total. On a hybrid the mamba pool is usually
    # the parallelism ceiling before KV is, so if max_running_requests gets
    # clamped low, raise mamba_full_memory_ratio rather than this.
    mem_fraction_static: "0.6"
    # flashinfer everywhere: the validated NVFP4 combination on this cluster,
    # and mandatory for the full-attention layers here (see SM121 review 5).
    attention_backend: flashinfer
    fp4_gemm_backend: flashinfer_cutlass
    disable_deep_gemm: true
    disable_cuda_graph: false
    disable_piecewise_cuda_graph: true
    pp_async_batch_depth: 0
    cuda_graph_max_bs: 32
    max_running_requests: 32
    # bf16 halves the ssm cache; DSPARK accept len unchanged (validated TP1 only, SINGLE_CLUSTER_COMPARE.md)
    mamba_ssm_dtype: "bfloat16"
    jit_max_jobs: 4
    # Dense model: no MoE knobs (no num_experts, no moe_runner_backend, no EPLB).
    enable_eplb: false
    enable_expert_distribution_metrics: false
    # <think>...</think> reasoning, and the qwen3_coder XML tool format
    # (<tool_call><function=name><parameter=x>), both verified in the shipped
    # chat_template.jinja. The template also accepts a reasoning_effort
    # chat_template_kwarg with levels xhigh (its default), medium and low, and
    # rejects anything else with an exception, so do not pass OpenAI's
    # "medium"-by-another-name values through untranslated.
    reasoning_parser: "qwen3"
    tool_call_parser: "qwen3_coder"
    # From the checkpoint's generation_config.json (do_sample true).
    recommended_sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
    # ═══ DSPARK speculative decoding (PREFERRED variant, currently SWITCHED OFF) ═══
    # speculative_enabled is false below, so this instance serves WITHOUT
    # speculation: no --speculative-* flag reaches SGLang, the draft is not
    # downloaded and the DSPARK block-size assert is skipped. Flip it to true to
    # activate everything in this block.
    # External draft: RadixArk/Qwen3.8-27B-DSpark, 1.36B BF16 (2.7 GB), 5 full
    # -attention layers, GQA 40q/8kv, trained with SpecForge against
    # Qwen/Qwen3.8-27B-FP8, confidence head = vanilla Markov rank 256, aux
    # features pulled from target layers [4, 16, 28, 40, 52]. The model
    # -download initContainer auto-appends speculative_draft_model_path, so the
    # draft is fetched with the target, no hf_preload entry needed.
    #
    # Hard constraints from speculative_hook.py::_handle_dspark that our
    # launcher passes explicitly and therefore must satisfy:
    #   - speculative_num_draft_tokens MUST equal gamma + 1. The draft's
    #     config.json says block_size 7, hence 8. A mismatch is a boot-time
    #     ValueError, not a warning.
    #   - speculative_num_steps and speculative_eagle_topk are forced to 1
    #     (warning only), set here to keep the log clean.
    #   - pp_size must be 1 (see tp_size above), device must be CUDA.
    #
    # speculative_dspark_block_size is deliberately LEFT UNSET. Empty means
    # SGLang reads gamma from the draft checkpoint and then cross-checks it
    # against the 8 below, so a future revision of the RadixArk repo that moves
    # block_size turns into a loud boot error. Pinning 7 here would instead
    # override the checkpoint silently and run the draft outside the window it
    # was trained for.
    speculative_enabled: true
    speculative_algo: DSPARK
    speculative_draft_model_path: "RadixArk/Qwen3.8-27B-DSpark"
    speculative_num_steps: 1
    speculative_eagle_topk: 1
    speculative_num_draft_tokens: 8  # = draft block_size (7) + 1. HARD requirement, see above.
    # The draft is a SEPARATE BF16 repo with no quant config of its own, so
    # without this it would inherit the target's modelopt_fp4 and fail to build
    # its weights. Unlike the in-checkpoint NEXTN case below, "unquant" is
    # meaningful here precisely because the draft path is a different repo.
    speculative_draft_model_quantization: "unquant"
    # Required for speculation on this Gated-DeltaNet hybrid: the GDN state has
    # to be rolled back per rejected draft token. Emitted by sglang_launch.sh as
    # the current --mamba-radix-cache-strategy (the --mamba-scheduler-strategy
    # spelling is a deprecated alias in 0.5.17). SGLang would resolve "auto" to
    # extra_buffer for this arch anyway; stating it keeps the intent visible.
    # Two asserts ride along and both hold at the defaults:
    # mamba_track_interval (256) >= speculative_num_draft_tokens (8), and
    # mamba_track_interval % page_size == 0.
    mamba_scheduler_strategy: extra_buffer
    # OPTIONAL, left OFF (repo default, unvalidated on GB10):
    # enable_linear_replayssm_spec: true -> --enable-linear-replayssm-spec
    # (PR #28695; both the flag and our knob were spelled ...gdn_replayssm_spec
    # until upstream's v0.5.17 rename). It replaces the
    # per-draft-token SSM snapshot with a ring buffer, upstream measuring
    # 11.5 GB -> 1.8 GB speculative scratch per GPU on a comparable GDN model,
    # which would come straight back as KV headroom via mem_fraction_static.
    # Its gate names DSPARK explicitly (verified in v0.5.17 server_args:
    # "requires the KDA fold-every-commit family (DSPARK/DFLASH)", and only for
    # non-static ragged-verify modes), needs speculative_eagle_topk in {None,1}
    # (satisfied) and does NOT conflict with extra_buffer (that restriction
    # applies to the non-spec --enable-linear-replayssm, which is a different
    # flag). Turning it on also forces mamba_ssm_dtype float32. A/B it against
    # the accept-length and throughput baseline before making it a default.
    # enable_spec_v2 deliberately NOT set: it only exports SGLANG_ENABLE_SPEC_V2
    # for the NEXTN/EAGLE v2 path, while DSPARK always runs through its own
    # dspark_worker_v2. Set it only if you switch to the NEXTN variant below.
    #
    # ═══ ALTERNATIVE: the in-checkpoint MTP head ═══
    # >>> MEASURED 2026-10-10 on 0.5.21 (single Spark): WORKS as EAGLE. <<<
    # Values that ran clean (GSM8K identical to no-draft, accept len 3.10 of 4,
    # peak tok/s 24.9 at n=1 / 255.2 at n=16, i.e. x2.0 / x1.5 over no
    # speculation but behind DSPARK gamma 7 by x1.9 / x1.3):
    #
    #   speculative_enabled: true
    #   speculative_algo: EAGLE
    #   speculative_draft_model_path: "vroomfondel/Qwen3.8-27B-NVFP4-ModelOpt"   # the target itself
    #   speculative_num_steps: 3
    #   speculative_eagle_topk: 1
    #   speculative_num_draft_tokens: 4
    #   mamba_scheduler_strategy: extra_buffer
    #
    # 5 steps / 6 draft tokens raised accept len to 3.62 but not throughput.
    # No speculative_draft_model_quantization was set for this run; the
    # BF16-MTP-on-FP4-target failure predicted further down did NOT occur.
    #
    # History, 2026-08-15 on 0.5.17 (NEXTN, did NOT work):
    # Tried with exactly the values below (steps 2, topk 1, draft tokens 3,
    # extra_buffer, spec_v2 on) against this target on GB10/sm121 + SGLang
    # 0.5.17: the scheduler died on the FIRST real request with a FlashInfer
    # exception in fast_prefill_plan -> call_begin_forward ->
    # update_single_wrapper -> init_forward_metadata_out_graph. With speculation
    # OFF the same checkpoint serves fine, and DSPARK above ran a full 65-minute
    # GSM8K without incident, so the fault sits on the NEXTN path specifically.
    # Not fully proven (the compared runs also differed in context length, and
    # the crashed container's log was lost before the final exception line), but
    # do not reach for this as a fallback: it is a known failure, not a spare.
    # Also note enable_spec_v2 below is a NO-OP on 0.5.17 -- the server logs
    # "SGLANG_ENABLE_SPEC_V2 has been removed: speculative decoding always runs
    # the V2 worker. Use --disable-overlap-schedule ...".
    # The checkpoint carries the base model's native MTP head
    # (mtp_num_hidden_layers 1, 15 mtp.* tensors, present and BF16 because
    # hf_quant_config excludes mtp* and transformers drops mtp.* at load, so
    # ModelOpt never sees it). That makes NEXTN available WITHOUT the 2.7 GB
    # external draft. To switch, comment out the DSPARK block above and
    # uncomment this one:
    #
    #   speculative_enabled: true
    #   speculative_algo: NEXTN
    #   speculative_num_steps: 2
    #   speculative_eagle_topk: 1
    #   speculative_num_draft_tokens: 3
    #   speculative_draft_model_path: ""        # empty = use the in-checkpoint MTP head
    #   speculative_draft_model_quantization: "unquant"
    #   mamba_scheduler_strategy: extra_buffer
    #   enable_spec_v2: true
    #
    # WHY IT IS NOT THE ACTIVE VARIANT. A BF16 MTP head on a modelopt_fp4
    # target is exactly the configuration this repo already has a documented
    # negative result for: see vroomfondel-qwen3.6-35b-a3b-nvfp4-modelopt.yml
    # risk #2, where SGLang inherits the target's modelopt_fp4 onto the draft,
    # allocates an FP4 draft buffer and then copies BF16 MTP weights into it.
    # And "unquant" is a weaker lever on this path than it looks: for a draft
    # that shares the TARGET's checkpoint, quant auto-detection re-reads the
    # same hf_quant_config and can re-promote the draft to modelopt_fp4, which
    # is why the Qwen3.6 line was eventually solved by surgically REQUANTIZING
    # the MTP head (p43/p44 + the -MTP- export) rather than by a flag. p43/p44
    # are inert for a BF16 MTP, so they will not rescue this variant either.
    # Expect either a dim-mismatch at draft-weight load or a silent quality
    # collapse; if it does boot, check `accept len` against the ceiling (3)
    # before believing the throughput number.
    # Measured ranking (2026-10-10): DSPARK gamma 7 > DSPARK gamma 5 > gamma 3
    # > MTP/EAGLE 3 steps > no speculation.
    #
    # ROLLBACK to bare serving: set speculative_enabled to false. Every other
    # key here stays valid and the speculative_* keys become
    # inert. mamba_scheduler_strategy does NOT: sglang_launch.sh emits
    # --mamba-radix-cache-strategy regardless of speculative_enabled. That is
    # harmless for this arch, because SGLang resolves "auto" to extra_buffer
    # anyway while the overlap scheduler is on (the default), so the explicit
    # value is redundant rather than wrong.
