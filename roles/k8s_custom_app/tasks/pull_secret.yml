---
- name: Create {{ app.name }} image pull secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ app.name }}-pull"
        namespace: "{{ app.namespace }}"
        labels: "{{ _app_labels }}"
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: >-
          {{ {'auths': {app.image_pull_secret.registry: {
                'username': app.image_pull_secret.username,
                'password': app.image_pull_secret.password,
                'auth': (app.image_pull_secret.username ~ ':' ~ app.image_pull_secret.password) | b64encode}}}
             | to_json }}
