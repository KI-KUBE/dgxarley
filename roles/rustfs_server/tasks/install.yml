---
- name: Preflight, validate distributed RustFS topology
  ansible.builtin.assert:
    that:
      - rustfs_server_raid_level in ['raid0', 'raid5', 'raid6']
      - rustfs_server_primary_node in (rustfs_server_members | map(attribute='node') | list)
      - (rustfs_server_total_drives | int) >= 4
      - (rustfs_server_parity | int) * 2 <= (rustfs_server_set_drive_count | int)
      - (rustfs_server_total_drives | int) % (rustfs_server_set_drive_count | int) == 0
    fail_msg: >-
      Invalid distributed RustFS topology. Requires: raid_level in raid0/raid5/raid6;
      the primary (rustfs_server_primary_node={{ rustfs_server_primary_node }}) present among
      rustfs_server_members; >=4 total drives (have {{ rustfs_server_total_drives }});
      parity*2 <= set_drive_count ({{ rustfs_server_parity }}*2 vs
      {{ rustfs_server_set_drive_count }}); and total drives an integer multiple
      of set_drive_count.
  when:
    - rustfs_server_distributed | bool
    - inventory_hostname == rustfs_server_primary_node

- name: Assert this RustFS node has a disk entry in rustfs_server_members
  ansible.builtin.assert:
    that: rustfs_server_local_disks | length > 0
    fail_msg: >-
      {{ inventory_hostname }} runs RustFS but has no matching entry in
      rustfs_server_members (the sole disk source, single-node included). Add one, e.g.:
        - node: {{ inventory_hostname }}
          disks: [{ path: <mountpoint>, uuid: "<blkid-UUID>", fstype: ext4 }]

# UUID, never /dev/sdX: USB device names reorder across boots.
- name: Mount RustFS USB-SSD(s) via fstab (UUID-keyed)
  ansible.posix.mount:
    src: "UUID={{ item.uuid }}"
    path: "{{ item.path }}"
    fstype: "{{ item.fstype | default('ext4') }}"
    opts: "{{ item.options | default('defaults,nofail') }}"
    dump: "{{ item.dump | default('0') }}"
    passno: "{{ item.passno | default('0') }}"
    state: mounted
  loop: "{{ rustfs_server_local_disks }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - rustfs_server_manage_fstab | bool
    - item.uuid is defined

- name: Check each RustFS storage path is a mountpoint
  ansible.builtin.command: "mountpoint -q {{ item }}"
  loop: "{{ rustfs_server_local_mounts }}"
  register: _disk_mp
  changed_when: false
  failed_when: false

- name: Fail if any RustFS storage disk is not a separate mountpoint
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      {{ item.item }} is not a mountpoint. Mount the USB-SSD there first; this role
      refuses to write RustFS object data onto the OS disk. Override with
      rustfs_server_require_disk_mount=false only for throwaway tests.
  loop: "{{ _disk_mp.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: rustfs_server_require_disk_mount | bool

- name: Create rustfs system group
  ansible.builtin.group:
    name: "{{ rustfs_server_user }}"
    system: true

- name: Create rustfs system user
  ansible.builtin.user:
    name: "{{ rustfs_server_user }}"
    group: "{{ rustfs_server_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/rustfs
    create_home: false

- name: Ensure RustFS data dir(s) exist on the USB-SSD(s)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rustfs_server_user }}"
    group: "{{ rustfs_server_user }}"
    mode: "0750"
  loop: "{{ rustfs_server_local_data_dirs }}"

- name: Ensure the RustFS state dir exists
  ansible.builtin.file:
    path: "{{ rustfs_server_state_dir }}"
    state: directory
    mode: "0755"

- name: Set rustfs arch
  ansible.builtin.set_fact:
    rustfs_server_arch: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"

# Falls back to the marker of the former juicefs_storage layout.
- name: Read installed rustfs version marker
  ansible.builtin.shell: >-
    cat {{ rustfs_server_state_dir }}/rustfs.version 2>/dev/null
    || cat /var/lib/juicefs_storage/rustfs.version
  register: _rustfs_marker
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install rustfs binary
  when: (_rustfs_marker.stdout | default('')) != rustfs_server_version
  block:
    - name: Ensure unzip is present
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Download rustfs zip
      ansible.builtin.get_url:
        url: "https://github.com/rustfs/rustfs/releases/download/{{ rustfs_server_version }}/rustfs-linux-{{ rustfs_server_arch }}-{{ rustfs_server_libc }}-v{{ rustfs_server_version }}.zip"
        dest: /tmp/rustfs.zip
        mode: "0644"
        force: true

    - name: Prepare rustfs unzip dir
      ansible.builtin.file:
        path: /tmp/rustfs-unzip
        state: directory
        mode: "0755"

    - name: Unzip rustfs
      ansible.builtin.unarchive:
        src: /tmp/rustfs.zip
        dest: /tmp/rustfs-unzip
        remote_src: true

    - name: Locate the rustfs binary in the archive
      ansible.builtin.find:
        paths: /tmp/rustfs-unzip
        patterns: rustfs
        file_type: file
        recurse: true
      register: _rustfs_found

    - name: Fail if rustfs binary not found in archive
      ansible.builtin.fail:
        msg: "rustfs binary not found inside the downloaded archive, check the asset name/version."
      when: _rustfs_found.files | length == 0

    - name: Install rustfs binary
      ansible.builtin.copy:
        src: "{{ _rustfs_found.files[0].path }}"
        dest: /usr/local/bin/rustfs
        remote_src: true
        mode: "0755"
      notify: restart rustfs

    - name: Clean up rustfs download artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/rustfs.zip
        - /tmp/rustfs-unzip

- name: Record rustfs version marker
  ansible.builtin.copy:
    content: "{{ rustfs_server_version }}"
    dest: "{{ rustfs_server_state_dir }}/rustfs.version"
    mode: "0644"

- name: Remove the version marker of the former juicefs_storage layout
  ansible.builtin.file:
    path: /var/lib/juicefs_storage/rustfs.version
    state: absent

- name: Ensure /etc/rustfs exists
  ansible.builtin.file:
    path: /etc/rustfs
    state: directory
    mode: "0750"

- name: Deploy RustFS credential env file
  ansible.builtin.template:
    src: rustfs.env.j2
    dest: /etc/rustfs/rustfs.env
    owner: root
    group: "{{ rustfs_server_user }}"
    mode: "0640"
  notify: restart rustfs
  no_log: true

- name: Deploy rustfs systemd unit
  ansible.builtin.template:
    src: rustfs.service.j2
    dest: /etc/systemd/system/rustfs.service
    mode: "0644"
  register: _rustfs_unit
  notify:
    - reload systemd
    - restart rustfs

- name: Enable and start RustFS
  ansible.builtin.systemd:
    name: rustfs
    daemon_reload: "{{ _rustfs_unit is changed }}"
    enabled: true
    state: started

# Distributed: every node must be up before a consumer (juicefs format) dials the primary.
- name: Apply pending RustFS restarts
  ansible.builtin.meta: flush_handlers
