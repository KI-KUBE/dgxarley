---
# Root credentials go in via RC_HOST_<alias>; `rc admin user add` takes the new user's secret as argv only.

- name: Stat the rc binary
  ansible.builtin.stat:
    path: /usr/local/bin/rc
  register: _rustfs_rc

- name: Assert rc is installed
  ansible.builtin.assert:
    that: _rustfs_rc.stat.exists
    fail_msg: /usr/local/bin/rc is missing, install it with roles/k3sserver/tasks/rustfs_client.yml (k3sserver role) first.
    quiet: true

- name: Ensure the RustFS policy directory exists
  ansible.builtin.file:
    path: "{{ rustfs_server_policy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Wait for the RustFS S3 endpoint to answer
  ansible.builtin.uri:
    url: "http://{{ rustfs_server_users_endpoint }}/"
    method: GET
    status_code: [200, 400, 403, 404]
  register: _rustfs_users_up
  retries: 30
  delay: 2
  until: _rustfs_users_up.status is defined and _rustfs_users_up.status > 0

- name: Configure RustFS S3 user
  ansible.builtin.include_tasks: user.yml
  loop: "{{ rustfs_server_users }}"
  loop_control:
    loop_var: _iam_user
    label: "{{ _iam_user.name }}"
