---
# Deploys the JuiceFS metadata engine on juicefs_primary_node: Valkey (apt package, managed
# valkey.conf with AOF + requirepass + noeviction) plus its metrics exporter.
# The S3 object store is the rustfs_server role.

- name: JuiceFS backend (Valkey) — install
  when:
    - juicefs_enabled | default(false) | bool
    - not (juicefs_backend_teardown | default(false) | bool)
    - inventory_hostname == juicefs_primary_node
  block:
    - name: Install Valkey
      ansible.builtin.apt:
        name: "{{ juicefs_valkey_apt_package }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy managed valkey.conf
      ansible.builtin.template:
        src: valkey.conf.j2
        dest: /etc/valkey/valkey.conf
        owner: valkey
        group: valkey
        mode: "0640"
      notify: restart valkey
      no_log: true  # contains requirepass

    # --- Boot hardening for the bind-scoped Valkey -------------------------
    # valkey.conf binds a SPECIFIC address (juicefs_valkey_bind_addresses). That
    # address may not exist yet at service start — the Debian unit only orders
    # itself After=network.target, which is reached long before an interface is
    # configured, and on the k3s master the storage address lives on an OVS VLAN
    # interface that comes up comparatively late.
    #
    # THE BIND ITSELF IS ALREADY SAFE: the common role sets
    # net.ipv4.ip_nonlocal_bind=1 on every k3sserver host, so binding a
    # not-yet-configured address succeeds and the socket picks up traffic once the
    # address appears. Everything below is defense in depth for that, and stands on
    # its own for the RETRY RATE (see below), which is the part that actually earns
    # its keep. If ip_nonlocal_bind is ever turned off, the ordering here is what is
    # left, so keep both.
    #
    # Restart=always (already in the vendor unit) does NOT save this: it ships with
    # RestartSec=100ms and the default StartLimitBurst=5 per 10s, so five retries
    # are spent within half a second and the unit then stays `failed` for good —
    # and with the metadata engine dead, every JuiceFS mount in the cluster stalls.
    #
    # ORDERING NARROWS THE WINDOW, THE RETRY LOOP CLOSES IT. Neither ordering
    # anchor is a guarantee that the address exists:
    #   * network-online.target — measured on this master, netplan invokes
    #     `systemd-networkd-wait-online --any -i <ovs-bridge>.<vlan> -i <usb-nic>`, so the
    #     target can be reached while the OVS VLAN interface carrying the storage
    #     address is still unconfigured. It is NOT the interface we need.
    #   * openvswitch-switch.service (only when wantsopenvswitch) — its completion means ovsdb-server +
    #     ovs-vswitchd are up, i.e. the bridge/port CAN exist; the address is then
    #     configured by systemd-networkd a moment later.
    # There is no "address X is up" unit to order against, so the actual safety
    # net is RestartSec=5s + StartLimitIntervalSec=0 (same rationale as the FUSE
    # mount unit): retry forever, a few seconds apart, until the bind succeeds.
    # Wants= pulls the unit into the transaction, After= orders us behind it —
    # both are needed, either alone is useless here.
    - name: Ensure the Valkey systemd drop-in dir exists
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ juicefs_valkey_apt_package }}.service.d"
        state: directory
        mode: "0755"

    - name: Harden Valkey boot ordering + restart rate (drop-in)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ juicefs_valkey_apt_package }}.service.d/10-juicefs.conf"
        mode: "0644"
        content: |
          # Managed by Ansible (juicefs_storage) — do not edit.
          # See tasks/backend.yml for the rationale.
          [Unit]
          After=network-online.target{{ ' openvswitch-switch.service' if (wantsopenvswitch | default(false)) else '' }}
          Wants=network-online.target{{ ' openvswitch-switch.service' if (wantsopenvswitch | default(false)) else '' }}
          StartLimitIntervalSec=0

          [Service]
          RestartSec=5s
      notify:
        - reload systemd
        - restart valkey

    - name: Enable and start Valkey
      ansible.builtin.systemd:
        name: "{{ juicefs_valkey_apt_package }}"
        daemon_reload: true
        enabled: true
        state: started

    # --- Valkey metrics exporter (gated by juicefs_metrics_enabled) ----------
    # oliver006/redis_exporter via the noble apt package (1.54 — old vs upstream
    # 1.86, but plenty for dashboard 763 + the redis_up alert; Valkey is supported
    # upstream). Scraped by the in-cluster Prometheus (job `juicefs-valkey` in
    # roles/k8s_infra/tasks/monitoring/prometheus.yml); iptables opens the port
    # from k3snodes (common role). Like the other <x>_enabled gates in this repo,
    # flipping the flag OFF only skips install — it deletes/stops nothing.
    - name: Configure Valkey metrics exporter
      when: juicefs_metrics_enabled | default(false) | bool
      block:
        - name: Install prometheus-redis-exporter (Valkey metrics)
          ansible.builtin.apt:
            name: prometheus-redis-exporter
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Configure prometheus-redis-exporter (Valkey auth + listen port)
          ansible.builtin.template:
            src: etc_default_prometheus-redis-exporter.j2
            dest: /etc/default/prometheus-redis-exporter
            owner: root
            group: root
            mode: "0600"
          notify: restart redis exporter
          no_log: true  # contains the Valkey requirepass

        - name: Enable and start prometheus-redis-exporter
          ansible.builtin.systemd:
            name: prometheus-redis-exporter
            enabled: true
            state: started

    - name: Apply backend config before formatting
      ansible.builtin.meta: flush_handlers

# Opt-in via -e juicefs_backend_teardown=true; skips the current juicefs_primary_node unless juicefs_enabled is false.
# Leaves the FUSE client alone; RustFS has its own teardown (rustfs_server_teardown).
- name: JuiceFS backend — teardown (former metadata node)
  when:
    - juicefs_backend_teardown | default(false) | bool
    - not (juicefs_enabled | default(false) | bool) or inventory_hostname != juicefs_primary_node
  block:
    - name: Look up the installed backend units
      ansible.builtin.command: "systemctl list-unit-files --no-legend {{ item }}.service"
      loop:
        - "{{ juicefs_valkey_apt_package }}"
        - prometheus-redis-exporter
      register: _jfs_teardown_units
      changed_when: false
      failed_when: _jfs_teardown_units.rc not in [0, 1]
      check_mode: false

    - name: Stop and disable the backend services
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: stopped
        enabled: false
      loop: "{{ _jfs_teardown_units.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout | trim | length > 0

    - name: Remove the backend config and credential files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/systemd/system/{{ juicefs_valkey_apt_package }}.service.d/10-juicefs.conf"
        - "/etc/systemd/system/{{ juicefs_valkey_apt_package }}.service.d"
        - /etc/default/prometheus-redis-exporter   # carries the Valkey requirepass
        - /etc/valkey/valkey.conf                  # carries the Valkey requirepass
        - /var/lib/valkey                          # STALE filesystem metadata
      register: _jfs_teardown_removed

    - name: Reload systemd after removing the units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Purge the backend packages
      ansible.builtin.apt:
        name:
          - "{{ juicefs_valkey_apt_package }}"
          - valkey-tools
          - prometheus-redis-exporter
        state: absent
        purge: true
        autoremove: false
      when: juicefs_backend_teardown_purge_packages | default(false) | bool

    - name: Report what the teardown removed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: removed
          {{ _jfs_teardown_removed.results | selectattr('changed') | map(attribute='item') | list | default([]) }}
          (packages purged: {{ juicefs_backend_teardown_purge_packages | default(false) | bool }})

- name: Note the host the backend teardown deliberately skipped
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is the CURRENT metadata node, backend teardown skipped on purpose."
  when:
    - juicefs_backend_teardown | default(false) | bool
    - juicefs_enabled | default(false) | bool
    - inventory_hostname == juicefs_primary_node
