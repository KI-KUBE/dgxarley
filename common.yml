---
- name: Apply common role to all DGX cluster nodes
  hosts: all,!disabled,!switches
  become: true
  roles:
    - common

- name: clevis/tang NBDE automatic LUKS decryption
  hosts: all,!disabled,!switches
  become: true
  gather_facts: true
  roles:
    - role: clevis
      # keyfile fallback (tag clevis_keyfile) also runs without wantsclevis; the role gates tang itself
      when: >-
        (wantsclevis | default(false)) or
        (clevis_keyfile_enabled | default(false)) or
        (clevis_keyfile_teardown | default(false))

- name: NUT UPS monitoring
  hosts: all,!disabled,!switches
  become: true
  roles:
    - role: nut
      when: wantsnut | default(false)

- name: Ops WireGuard tunnel (box side)
  hosts: all,!disabled,!switches
  become: true
  roles:
    - role: ops_wireguard
      tags:
        - ops_wireguard
      when: (ops_wireguard_enabled | default(false) | bool) or (ops_wireguard_teardown | default(false) | bool)
