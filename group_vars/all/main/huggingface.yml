---
# Public dummy/example values — real values live in group_vars/all/vault/ (git-crypt).
# HuggingFace
hf_token: "hf_CHANGEME"
# HF_HUB_DISABLE_XET propagated to every container that does HF downloads
# (sglang/vllm head+worker+shard, hf_preload, sglang_tune_moe, comfyui, docling).
# 0 = keep hf_xet transfer; 1 = disable it (plain HTTPS/LFS). Real value in vault.
# HF reads this as a boolean (only 1/true/yes/on disable xet), so the dummy 0 is
# a safe default. Disabling xet is NOT the lever against download RSS — see the
# HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_* note in the vault copy.
hf_hub_disable_xet: 0
# HF_XET_HIGH_PERFORMANCE — same propagation as above, but wired through this
# INVERTED knob (mirrors the hf_hub_disable_* naming). The env var is the negation:
#   HF_XET_HIGH_PERFORMANCE = 1  when  hf_hub_xet_disable_high_performance = 0 (default)
#   HF_XET_HIGH_PERFORMANCE = 0  when  hf_hub_xet_disable_high_performance = 1
# i.e. high-performance transfer is ON by default; set this to 1 to turn it OFF.
# High-perf is the official replacement for the now-ignored HF_HUB_ENABLE_HF_TRANSFER
# and bumps hf_xet concurrency / buffer / parallel-file limits (HF recommends it on
# high-bandwidth hosts with >=64GB RAM — the GB10 sparks have 128GB unified, so it
# fits). NOTE: no-op when HF_HUB_DISABLE_XET=1 turns the whole xet path off.
hf_hub_xet_disable_high_performance: 0
# HF_HUB_DISABLE_TELEMETRY — same propagation as hf_hub_disable_xet, plus /etc/environment
# on the sparks (dgx_prepare, tag hf_env) because the bare-metal podman/quantizer runs are
# what actually hit the Hub as root. 1 = no telemetry. Not a secret, so the real value lives
# here and NOT in the vault copy.
# Two effects, both wanted:
#   - stops the agent/torch fields being appended to the HF user-agent (utils/_headers.py)
#   - stops the AI-agent-harness registry being fetched from {ENDPOINT}/api/agent-harnesses
#     and cached to $HF_HOME/.agent_harnesses.json (utils/_detect_agent.py) — that file
#     showing up in /mnt/jfs is what prompted this knob.
# CAVEAT: the `hf`/`huggingface-cli` CLI calls is_agent() ungated (cli/_output.py, only to
# pick its output format), so a CLI download still fetches+writes the registry file even
# with this set. Only HF_HUB_OFFLINE=1 blocks the fetch outright — not set globally here.
hf_hub_disable_telemetry: 1
# HF_XET_NUM_CONCURRENT_RANGE_GETS — DEAD KNOB as of hf_xet shipped with
# huggingface_hub 1.32.0: the name is not present in the compiled hf_xet binary
# (verified in the hf-preload pod), so whatever is set here is ignored. xet-core
# now sizes download concurrency adaptively; pin it with
# HF_XET_FIXED_DOWNLOAD_CONCURRENCY instead. Kept wired only so a value does not
# silently vanish from the download containers.
hf_xet_num_concurrent_range_gets: 16
# HF_XET_RECONSTRUCT_WRITE_SEQUENTIALLY — DEAD KNOB, same as the one above: the
# name is absent from the compiled hf_xet binary. Its successor is
# HF_XET_RECONSTRUCTION_USE_VECTORED_WRITE, which is NOT wired up here.
# The intent was: chunk writes go to disk in parallel (tuned for SSD/NVMe), which
# on the JuiceFS object backend (a USB-3.0 spinning disk) turns into seeks.
hf_xet_reconstruct_write_sequentially: 0
# HF_XET_RECONSTRUCTION_* + HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS — the real
# RAM bound on the xet download path, propagated like the knobs above. Not secret,
# so the real values live here and NOT in the vault copy.
# Upstream defaults alone (8gb hard limit, 2gb buffer, 512mb per file x 8 concurrent
# files) match the hf-preload Job's 8Gi cap and OOM-kill it; these caps hold a
# download near 2 GB RSS. HF_XET_HIGH_PERFORMANCE=1 raises the hard limit to 64gb
# and overrides them, so it must stay off wherever these matter.
# Sizes take a human-readable suffix (mb/gb) or a raw byte count. XET-ONLY.
hf_xet_reconstruction_download_buffer_limit: "2gb"
hf_xet_reconstruction_download_buffer_size: "1gb"
hf_xet_reconstruction_download_buffer_perfile_size: "256mb"
hf_xet_reconstruction_min_prefetch_buffer: "256mb"
hf_xet_data_max_concurrent_file_downloads: 2
