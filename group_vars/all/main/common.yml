---
# Public dummy/example values. Real values live in group_vars/all/vault/<topic>.sops.yml of the private sops overlay.
ansible_ssh_user: root

fail2ban_recipient: "fail2ban@example.com"
fail2ban_ignoreips:
  - "192.168.123.0/16"

smartd_mail_recipients: "root,admin@example.com"

# Postfix relay
postfix_relayhost: "[mail.example.com]"
# /etc/hosts alias for the relay (roles/common/defaults); the IP is set per host in host_vars
postfix_relay_alias: "mailrelay"
postfix_relay_alias_ip: ""
postfix_queue_lifetime: "5d"
# Clients allowed to relay (besides loopback): the networks the firewall trusts, never the port-forwarded customer LAN.
postfix_mynetworks: "{{ (localnets | default([]) + localnets_k3sserver | default([])) | map(attribute='cidr') | list }}"

# Geoblock/Allow
geoallow:
  - de
geoblock:
  - cn

localnets:
  - {cidr: "10.0.0.0/8", comment: "private-rfc1918"}
  - {cidr: "172.16.0.0/12", comment: "private-rfc1918"}
  - {cidr: "192.168.0.0/16", comment: "private-rfc1918"}
  - {cidr: "169.254.0.0/16", comment: "link-local"}

localnets_ipv6:
  - {cidr: "fe80::/10", comment: "link-local"}
# iptables
iptables_xosrc_ips: []
iptables_lifeline_ips: []
iptables_k3s_external_ips: []
# TCP ports open to every source (the router's port forwards); localnets stays the internal LAN.
iptables_public_tcp_ports: "{{ lan_ingress.tcp_ports | default([]) if (lan_ingress.enabled | default(false) | bool and inventory_hostname == lan_ingress.target_host | default('')) else [] }}"
iptables_static_dns_ips: []

# Clevis / Tang NBDE: every enabled host with providestang except the client itself; t=1 = any one tang unlocks.
# Per tang host, `tang_url` overrides the derived http://<k3s_node_ip>:<tang_port>.
clevis_tang_servers: >-
  {%- set out = [] -%}
  {%- for h in groups['all'] | difference(groups['disabled'] | default([])) | sort -%}
  {%- if (hostvars[h].providestang | default(false) | bool) and h != inventory_hostname -%}
  {%- set _ = out.append(hostvars[h].tang_url | default('http://' ~ hostvars[h].k3s_node_ip ~ ':' ~ (hostvars[h].tang_port | default(9090)))) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
clevis_sss_threshold: 1

# WiFi access points
wifi_access_points: []
# DynDNS hostname for ipset updates
dyndns_hostname: "dyn.example.com"

# HAProxy stats
haproxy_stats_password: "changeme"

# Podman: use the static mgoltzsche/podman-static bundle instead of apt podman.
# Only takes effect on hosts with `wantspodman: true` (the dgxsparks + k3smaster for
# the tang Quadlet); installpodman.yml is skipped on all others. When true, apt
# podman is skipped (buildah still from apt) and the version-pinned static stack is
# installed under /usr/local. Bump target: roles/common/defaults/main.yml.
podman_static_enabled: true
