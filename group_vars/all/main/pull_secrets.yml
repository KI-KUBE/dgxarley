---
# Public dummy/example values. Real values live in group_vars/all/vault/<topic>.sops.yml of the private sops overlay.
# --- Registry pull credentials for private images ---
# One entry per access path; the key becomes the name of the kubernetes.io/dockerconfigjson
# secret that k8s_infra renders into every listed namespace, and that Deployments reference
# via imagePullSecrets. Keep one token per purpose (least privilege, independent rotation).
# Ansible replaces dicts from the vault as a whole (hash_behaviour=replace), so the vault
# must carry complete entries, not just the token.
# `scope` decides how the credential reaches the nodes:
#   namespace  -> a kubernetes.io/dockerconfigjson secret per listed namespace, referenced by
#                 Deployments via imagePullSecrets (private images).
#   node       -> written into /etc/rancher/k3s/registries.yaml (configs.<registry>.auth) on every
#                 k3s node, so every pull of that registry is authenticated: the right place for
#                 Docker Hub rate limits, no per-pod wiring, covers system images too.
# GHCR: classic PAT with read:packages only (fine-grained PATs do not cover GHCR packages).
# Docker Hub: personal access token; "Read-only" for private repos, "Public Repo Read-only" for node scope.
# Docker Hub secrets must use the auth key "https://index.docker.io/v1/" in .dockerconfigjson, not "docker.io";
# the rendering task maps registry: docker.io to that key.
# Track `expires` ("never" allowed) and renew before; an expired token shows up as ImagePullBackOff.
registry_pull_secrets:
  ghcr-krag:
    registry: "ghcr.io"
    user: "your-github-username"
    token: "ghp_changeme"
    scope: namespace
    namespaces: [krag]
    expires: "2027-01-01"
    note: "pull ghcr.io/ki-kube/krag (private)"
  dockerhub-private:
    registry: "docker.io"
    user: "your-dockerhub-username"
    token: "dckr_pat_changeme"
    scope: namespace
    namespaces: [krag]
    expires: "never"
    note: "pull private docker.io/<user>/* images; PAT permission Read-only (covers private repos)"
  # Optional, additional to the entries above: one node-scoped entry per public registry so every
  # pull is authenticated and counted against the account instead of the shared WAN IP
  # (Docker Hub anonymous limit). Same token kind, scope: node, namespaces: []. Rendering into
  # /etc/rancher/k3s/registries.yaml is a k3s-role task in this repo, not a per-app concern.
