---
# Public dummy/example values. Real values live in group_vars/all/vault/<topic>.sops.yml of the private sops overlay.
# Traefik IP-Allowlist for internal services (k8s_infra + k8s_dgx)
traefik_internal_allowlist: >-
  {{ ((localnets | default([]) + localnets_k3sserver | default([])) | map(attribute='cidr') | list)
     + (lan_ingress.networks | default([]) if lan_ingress.enabled | default(false) | bool else []) }}
app_exposure_default: lan
app_exposure: {}
# public routes keep their middleware object but allow every source
traefik_public_allowlist: ["0.0.0.0/0", "::/0"]

# Traefik dashboard basic-auth password
traefik_dashboard_password: "changeme"
