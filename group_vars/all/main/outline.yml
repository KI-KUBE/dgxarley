---
# Public dummy/example values. Real values live in group_vars/all/vault/<topic>.sops.yml of the private sops overlay.
outline_secret_key: "changeme"
outline_utils_secret: "changeme"
outline_admin:
  name: "Admin"
  email: "admin@example.com"
  api_key: "ol_api_changeme"
  hermes_user: example_outline_admin
# All humans; hermes_user (required for every hermes user with an Outline agent, also on outline_admin) links a human to "<user> (Hermes)".
outline_users:
  - name: "Example User"
    email: "example@example.com"
    role: member
    hermes_user: example
