name: mypy and pytests

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

  pull_request:

#on:
#  workflow_run:
#    workflows: ["black-lint and static type check"]
#    branches: ["main"]
#    types:
#      - completed

jobs:
  pytest:
    runs-on: ubuntu-latest
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setting up python env
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: get some runtime info
        run: |
          echo PWD: $(pwd)
          echo ENV: $(env)
          echo GH-REF: ${{ github.ref }}
          echo GH-SHA: ${{ github.sha }}
          tree

      - name: installing make
        run: |
          sudo apt update && sudo apt install -y make

      # The Makefile calls .venv/bin/<tool> explicitly, and its own .venv
      # target installs only requirements.txt (no mypy/pytest). Pre-build the
      # venv with the dev set and touch the touchfile afterwards so make treats
      # it as up to date instead of rebuilding it from requirements.txt.
      - name: installing pip-packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # torch CPU-only build for type stubs (no CUDA needed on CI)
          .venv/bin/pip install -r requirements-dev-cpu.txt
          touch .venv/touchfile

      - name: static type checking with mypy
        run: make tcheck


      - name: run pytest
        run: make tests
